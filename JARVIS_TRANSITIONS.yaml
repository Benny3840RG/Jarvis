version: 1
status: canonical-machine-source
schema_version: 1

side_effect_classes:
  S0: observation/read only
  S1: internal reversible state
  S2: internal consequential state
  S3: external reversible effect
  S4: external consequential effect
  S5: irreversible/high-impact effect

failure_classes:
  REJECTED: request was not admissible and no valid operation began
  FAILED: valid operation began and evidence establishes failure
  INDETERMINATE: valid operation may have produced an effect but outcome is unproven

actor_roles:
  - requested_by
  - evaluated_by
  - authorised_by
  - committed_by

development_states:
  - IDEA
  - SPECIFIED
  - READY
  - CLAIMED
  - BUILDING
  - VERIFYING
  - REPAIR_REQUIRED
  - REVIEW
  - READY_TO_MERGE
  - MERGED
  - RECONCILIATION_OPEN
  - ABORTED
  - COMPLETE

transitions:
  - id: DEV_TRANSITION_SPECIFIED_TO_READY
    domain: development
    from: SPECIFIED
    to: READY
    side_effect_class: S1
    authoritative_committer: controller
    evaluator: deterministic_spec_validator
    approval: none
    reversible: true
    retry_target: validation_operation
    invariants: [JARVIS-011, JARVIS-012, JARVIS-014]

  - id: DEV_TRANSITION_READY_TO_CLAIMED
    domain: development
    from: READY
    to: CLAIMED
    side_effect_class: S2
    authoritative_committer: controller
    evaluator: claim_lease_gate
    approval: policy
    reversible: true
    retry_target: claim_operation
    invariants: [JARVIS-007, JARVIS-013, JARVIS-017]

  - id: DEV_TRANSITION_CLAIMED_TO_BUILDING
    domain: development
    from: CLAIMED
    to: BUILDING
    side_effect_class: S2
    authoritative_committer: controller
    evaluator: lease_authority_branch_gate
    approval: existing_claim
    reversible: true
    retry_target: setup_operation
    invariants: [JARVIS-007, JARVIS-013, JARVIS-016, JARVIS-017]
    gates:
      - lease_current
      - worker_matches_lease
      - worker_authority_subset_of_mission
      - repository_authorised
      - branch_authorised

  - id: DEV_TRANSITION_BUILDING_TO_VERIFYING
    domain: development
    from: BUILDING
    to: VERIFYING
    side_effect_class: S1
    authoritative_committer: controller
    evaluator: build_artifact_gate
    approval: none
    reversible: false
    retry_target: verification_start_operation
    invariants: [JARVIS-004, JARVIS-012, JARVIS-017]

  - id: DEV_TRANSITION_VERIFYING_TO_REPAIR_REQUIRED
    domain: development
    from: VERIFYING
    to: REPAIR_REQUIRED
    side_effect_class: S1
    authoritative_committer: controller
    evaluator: verification_policy
    approval: none
    reversible: true
    retry_target: none
    invariants: [JARVIS-004, JARVIS-015]

  - id: DEV_TRANSITION_REPAIR_REQUIRED_TO_BUILDING
    domain: development
    from: REPAIR_REQUIRED
    to: BUILDING
    side_effect_class: S1
    authoritative_committer: controller
    evaluator: repair_authority_gate
    approval: none
    reversible: true
    retry_target: repair_operation
    invariants: [JARVIS-007, JARVIS-016, JARVIS-017]

  - id: DEV_TRANSITION_VERIFYING_TO_REVIEW
    domain: development
    from: VERIFYING
    to: REVIEW
    side_effect_class: S1
    authoritative_committer: controller
    evaluator: required_checks_gate
    approval: none
    reversible: false
    retry_target: verification_operation
    invariants: [JARVIS-004, JARVIS-011]

  - id: DEV_TRANSITION_REVIEW_TO_REPAIR_REQUIRED
    domain: development
    from: REVIEW
    to: REPAIR_REQUIRED
    side_effect_class: S1
    authoritative_committer: controller
    evaluator: review_findings_gate
    approval: none
    reversible: true
    retry_target: none
    invariants: [JARVIS-004, JARVIS-015]

  - id: DEV_TRANSITION_REVIEW_TO_READY_TO_MERGE
    domain: development
    from: REVIEW
    to: READY_TO_MERGE
    side_effect_class: S2
    authoritative_committer: controller
    evaluator: review_invariant_gate
    approval: policy
    reversible: true
    retry_target: review_operation
    invariants: [JARVIS-001, JARVIS-011, JARVIS-018]

  - id: DEV_TRANSITION_READY_TO_MERGE_TO_MERGED
    domain: development
    from: READY_TO_MERGE
    to: MERGED
    side_effect_class: S4
    authoritative_committer: controller
    evaluator: risk_approval_head_integrity_gate
    approval: risk_dependent
    reversible: false
    retry_target: merge_operation
    indeterminate_resolution:
      opens_state: RECONCILIATION_OPEN
      permitted_resolvers: [reconciler, controller]
      terminal_by_timeout: false
      resolution_requires_external_observation: true
    invariants: [JARVIS-003, JARVIS-005, JARVIS-015, JARVIS-016]

  - id: DEV_TRANSITION_MERGED_TO_RECONCILIATION_OPEN
    domain: development
    from: MERGED
    to: RECONCILIATION_OPEN
    side_effect_class: S1
    authoritative_committer: reconciler
    evaluator: evidence_conflict_gate
    approval: policy
    reversible: true
    retry_target: reconciliation_operation
    invariants: [JARVIS-004, JARVIS-005, JARVIS-008]

  - id: DEV_TRANSITION_RECONCILIATION_OPEN_TO_MERGED
    domain: development
    from: RECONCILIATION_OPEN
    to: MERGED
    side_effect_class: S1
    authoritative_committer: reconciler
    evaluator: reconciliation_proof_gate
    approval: policy
    reversible: true
    retry_target: reconciliation_operation
    invariants: [JARVIS-005, JARVIS-008]

  - id: DEV_TRANSITION_MERGED_TO_COMPLETE
    domain: development
    from: MERGED
    to: COMPLETE
    side_effect_class: S2
    authoritative_committer: omega
    evaluator: omega_completion_policy
    approval: omega_only
    reversible: false
    retry_target: omega_evaluation_operation
    gates:
      - omega_identity_verified
      - completion_evaluation_complete
      - zero_blocking_contradictions
      - reconciliation_closed
      - current_evidence_satisfies_criteria
    invariants: [JARVIS-001, JARVIS-004, JARVIS-008, JARVIS-018]

  - id: DEV_TRANSITION_BUILDING_TO_ABORTED
    domain: development
    from: BUILDING
    to: ABORTED
    side_effect_class: S2
    authoritative_committer: controller
    evaluator: abort_policy
    approval: policy
    reversible: false
    retry_target: abort_cleanup_operation
    invariants: [JARVIS-005, JARVIS-012, JARVIS-017]
