name: Agent repair formatter

on:
  push:
    branches:
      - agent/repair-convex-execution-boundaries

permissions:
  contents: write

jobs:
  format-and-repair-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/repair-convex-execution-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        working-directory: typescript
        run: npm ci
      - name: Repair OpenAPI execution metadata
        working-directory: typescript
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "openapi/jarvis.openapi.json";
          const contract = JSON.parse(fs.readFileSync(path, "utf8"));
          contract.info.description =
            "Jarvis accepts structured operator requests, routes work through its runtime and safety envelope, persists tasks and reminders through the configured JSON or Convex provider, runs proposal-only Totality reasoning, stages revision-checked project-memory changes, and stores revision-bound tool-action proposals for explicit approval or rejection. Approved tool actions may be executed through the small reviewed server-side allowlist, with durable receipts and external reconciliation where required. The private development ChatGPT App preview provides a stateless Streamable HTTP MCP adapter and versioned dashboard widget for the operations marked with x-mcp-tool.exposed=true. Jarvis and OpenAI credentials remain server-side. This contract is intentionally single-user and private.";

          const toolActionsTag = contract.tags.find((tag) => tag.name === "Tool Actions");
          if (!toolActionsTag) throw new Error("Tool Actions tag is missing.");
          toolActionsTag.description =
            "Revision-bound tool-action proposal, inspection, approval, rejection, and execution through the reviewed server-side allowlist. Approval alone does not execute the operation.";

          const restOnly = contract["x-chatgpt-app"].restOnlyOperationIds;
          if (!restOnly.includes("executeToolAction")) restOnly.push("executeToolAction");

          const execute =
            contract.paths["/api/v1/projects/{projectId}/tool-actions/{actionId}/execute"]?.post;
          if (!execute) throw new Error("executeToolAction operation is missing.");
          execute.description =
            "Runs an approved proposal against the reviewed tool/operation allowlist and returns a durable receipt. The active internal allowlist contains notes:create, tasks:create, tasks:complete, reminders:create, and reminders:cancel. Blocked, timed-out, indeterminate, and failed outcomes are returned as receipts with a 200 status because the execution attempt itself completed. Quote finalisation and sending remain unavailable until separately commissioned.";

          fs.writeFileSync(path, `${JSON.stringify(contract, null, 2)}\n`);
          NODE
      - name: Format repository
        working-directory: typescript
        run: npm run format
      - name: Commit formatted repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript
          git commit -m "chore: format Convex repair and align OpenAPI"
          git push origin HEAD:agent/repair-convex-execution-boundaries
