name: Apply Console 01 HUD

on:
  push:
    branches:
      - feat/console-01-mascot-hud
    paths:
      - typescript/scripts/apply-console01-hud.mjs
      - .github/workflows/apply-console01-hud.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/console-01-mascot-hud
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
      - name: Apply HUD migration
        working-directory: typescript
        run: node scripts/apply-console01-hud.mjs
      - name: Validate embedded JavaScript
        working-directory: typescript
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import vm from "node:vm";
          const html = fs.readFileSync("src/mcp/dashboard-v1.html", "utf8");
          const source = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!source) throw new Error("Dashboard script missing");
          new vm.Script(source);
          NODE
      - name: Commit generated HUD
        run: |
          if git diff --quiet; then
            echo "Console 01 HUD already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/src/mcp/dashboard-v1.html
          git commit -m "feat(mcp): install Console 01 mascot HUD"
          git push origin HEAD:feat/console-01-mascot-hud
