name: Omega exact formatter helper

on:
  push:
    branches:
      - agent/omega-pass2-runtime-integration
    paths:
      - .github/workflows/omega-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        working-directory: typescript
        run: npm ci

      - name: Format only files flagged by the exact-head CI gate
        working-directory: typescript
        run: >-
          npx prettier
          convex/omegaActionContracts.ts
          convex/omegaExecutionGate.ts
          convex/omegaMissions.ts
          convex/omegaValidators.ts
          convex/toolActions.ts
          src/omega/policy.ts
          --write

      - name: Commit exact Prettier output atomically
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TARGET_BRANCH: agent/omega-pass2-runtime-integration
        with:
          script: |
            const fs = require('fs');
            const paths = [
              'typescript/convex/omegaActionContracts.ts',
              'typescript/convex/omegaExecutionGate.ts',
              'typescript/convex/omegaMissions.ts',
              'typescript/convex/omegaValidators.ts',
              'typescript/convex/toolActions.ts',
              'typescript/src/omega/policy.ts',
            ];
            const tree = [];
            for (const path of paths) {
              const { data: blob } = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: fs.readFileSync(path, 'utf8'),
                encoding: 'utf-8',
              });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            }
            const { data: createdTree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: context.sha,
              tree,
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'style(omega): apply locked Prettier output',
              tree: createdTree.sha,
              parents: [context.sha],
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${process.env.TARGET_BRANCH}`,
              sha: commit.sha,
              force: false,
            });
            core.info(`Created formatting commit ${commit.sha}`);
