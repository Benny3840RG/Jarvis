name: Jarvis PR maintenance
run-name: >-
  ${{ inputs.mode == 'review' && format('Jarvis PR review #{0} {1} {2} {3}', inputs.pull_request_number, inputs.expected_head_sha, inputs.expected_base_sha, inputs.evidence_fingerprint) || 'Jarvis PR maintenance sweep' }}

on:
  workflow_run:
    workflows: [TypeScript checks, PR Evidence Check, Jarvis autonomous build]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [sweep, review]
        default: sweep
      pull_request_number:
        description: Optional PR for a sweep; required for an exact-candidate review
        type: string
      expected_head_sha:
        type: string
      expected_base_sha:
        type: string
      evidence_fingerprint:
        type: string

permissions: {}

concurrency:
  group: >-
    jarvis-pr-maintenance-${{ github.repository }}-${{ inputs.mode == 'review' && format('pr-{0}', inputs.pull_request_number) || 'sweep' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    outputs:
      selected: ${{ steps.prepare.outputs.selected }}
      prompt-ready: ${{ steps.prepare.outputs.prompt-ready }}
      manifest: ${{ steps.prepare.outputs.manifest }}
      manifest-digest: ${{ steps.prepare.outputs.manifest-digest }}
      segments: ${{ steps.prepare.outputs.segments }}
    steps:
      - name: Check out trusted workflow revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Select or prepare an exact candidate
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}
          JARVIS_SERVICE_TOKEN: ${{ secrets.JARVIS_SERVICE_TOKEN }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.expected_head_sha }}
          BASE_SHA: ${{ inputs.expected_base_sha }}
          EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { sweep, prepareSegmentedReview } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/automation/pr-maintenance-controller.mjs`,
            ).href);
            const { owner, repo } = context.repo;
            const pullNumber = process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : undefined;
            if (pullNumber !== undefined && (!Number.isSafeInteger(pullNumber) || pullNumber < 1)) {
              throw new Error('PR number must be a positive integer.');
            }
            if (context.eventName === 'workflow_dispatch' && context.actor !== 'github-actions[bot]') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: context.actor });
              if (!['admin', 'maintain', 'write'].includes(data.permission)) throw new Error('Repository writer permission is required.');
            }
            if (process.env.MODE !== 'review') {
              await sweep({ github, owner, repo, pullNumber, core });
              return;
            }
            const identity = { pullNumber, headSha: process.env.HEAD_SHA, baseSha: process.env.BASE_SHA, fingerprint: process.env.EVIDENCE_FINGERPRINT };
            const plan = await prepareSegmentedReview({ github, owner, repo, identity, runId: context.runId, runAttempt: Number(process.env.RUN_ATTEMPT) });
            if (plan.blockedReason) core.warning(plan.blockedReason);
            core.setOutput('manifest', plan.manifest ? JSON.stringify(plan.manifest) : 'null');
            core.setOutput('manifest-digest', plan.digest || '');
            core.setOutput('segments', JSON.stringify(plan.manifest ? plan.manifest.segments.map(s => s.index) : []));
            core.setOutput('prompt-ready', Boolean(plan.manifest));
            core.setOutput('selected', 'true');

  review:
    needs: prepare
    if: needs.prepare.outputs.selected == 'true' && needs.prepare.outputs.prompt-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        segment: ${{ fromJSON(needs.prepare.outputs.segments) }}
    steps:
      - name: Check out trusted socket compatibility control only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Prepare isolated review directory and worker socket isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jarvis-independent-review"
          if [[ ! -x /usr/bin/getfacl || ! -x /usr/bin/setfacl ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y acl
          fi
          actions_root="$(dirname "$(realpath "$RUNNER_TEMP")")/_actions"
          bundle="$actions_root/openai/codex-action/86365089eb2b84e0a8fb0717b304f8bdcb13b20e/dist/main.js"
          test -f "$bundle" && test ! -L "$bundle"
          node .github/automation/patch-codex-sockets.mjs "$bundle"
      - name: Reconstruct exact bounded segment on the trusted runner
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REVIEW_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
          SEGMENT_INDEX: ${{ matrix.segment }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { writeFileSync } = require('node:fs');
            const { rebuildSegmentedReview } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/pr-maintenance-controller.mjs`).href);
            const { segmentReceipt } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/automation/review-segments.mjs`).href);
            const plan = await rebuildSegmentedReview({ github, ...context.repo, manifest:JSON.parse(process.env.REVIEW_MANIFEST), expectedDigest:process.env.MANIFEST_DIGEST });
            const index = Number(process.env.SEGMENT_INDEX);
            const receipt = segmentReceipt(plan,index,'');
            const root = `${process.env.RUNNER_TEMP}/jarvis-independent-review`;
            writeFileSync(`${root}/prompt.txt`,plan.prompts[index],{flag:'wx',mode:0o644});
            writeFileSync(`${root}/binding.json`,JSON.stringify(receipt),{flag:'wx',mode:0o644});
      - name: Review supplied evidence without executing candidate code
        id: reviewer
        timeout-minutes: 15
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/jarvis-independent-review/prompt.txt
          working-directory: ${{ runner.temp }}/jarvis-independent-review
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          output-schema: |
            {"type":"object","additionalProperties":false,"required":["verdict","summary","findings","contextRequests"],"properties":{"contextRequests":{"type":"array","items":{"type":"string"}},"verdict":{"type":"string","enum":["pass","changes_requested","blocked"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["file","line","severity","message"],"properties":{"file":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string","enum":["high","medium","low"]},"message":{"type":"string"}}}}}}
          allow-bot-users: github-actions[bot]
          model: gpt-5.6-luna
          effort: high

      - name: Bind bounded model output to the trusted segment
        env:
          REVIEW_JSON: ${{ steps.reviewer.outputs.final-message }}
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const root = `${process.env.RUNNER_TEMP}/jarvis-independent-review`;
          const receipt = JSON.parse(fs.readFileSync(`${root}/binding.json`,'utf8'));
          const raw = process.env.REVIEW_JSON || '';
          if(Buffer.byteLength(raw)>32768) throw new Error('Segment output exceeds bound.');
          fs.writeFileSync(`${root}/result.json`,JSON.stringify({...receipt,raw}),{flag:'wx',mode:0o600});
          JS
      - name: Retain exact segment result for the isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jarvis-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.segment }}
          path: ${{ runner.temp }}/jarvis-independent-review/result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
    steps:
      - name: Check out trusted publication controls on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Read results from this workflow attempt only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: jarvis-review-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/jarvis-review-results
      - name: Recheck evidence, publish advisory review and request bounded repair
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.expected_head_sha }}
          BASE_SHA: ${{ inputs.expected_base_sha }}
          EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}
          JARVIS_SERVICE_TOKEN: ${{ secrets.JARVIS_SERVICE_TOKEN }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { publishSegmentedReview } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/automation/pr-maintenance-controller.mjs`,
            ).href);
            const fs = require('node:fs');
            const resultRoot = `${process.env.RUNNER_TEMP}/jarvis-review-results`;
            let receipts = [];
            try {
              const entries = fs.readdirSync(resultRoot,{withFileTypes:true});
              if(entries.length>16) throw new Error('Too many segment artifacts.');
              receipts = entries.map(entry => {
                if(!entry.isDirectory() || !new RegExp(`^jarvis-review-${context.runId}-${process.env.RUN_ATTEMPT}-[0-9]+$`).test(entry.name)) throw new Error('Unexpected artifact.');
                const file = `${resultRoot}/${entry.name}/result.json`;
                if(fs.readdirSync(`${resultRoot}/${entry.name}`).join() !== 'result.json' || !fs.lstatSync(file).isFile() || fs.statSync(file).size>70000) throw new Error('Invalid result artifact.');
                const receipt = JSON.parse(fs.readFileSync(file,'utf8'));
                if(String(receipt.index)!==entry.name.split('-').at(-1)) throw new Error('Artifact index mismatch.');
                return receipt;
              });
            } catch { receipts = []; }
            let manifest = null;
            try { if(Buffer.byteLength(process.env.REVIEW_MANIFEST || '')>32768) throw new Error('Manifest exceeds bound.'); manifest = JSON.parse(process.env.REVIEW_MANIFEST || 'null'); }
            catch { core.warning('Invalid review manifest; publishing blocked evidence.'); }
            const disposition = await publishSegmentedReview({ github, ...context.repo,
              identity: { pullNumber: Number(process.env.PR_NUMBER), headSha: process.env.HEAD_SHA,
                baseSha: process.env.BASE_SHA, fingerprint: process.env.EVIDENCE_FINGERPRINT },
              manifest, expectedDigest:process.env.MANIFEST_DIGEST,
              receipts, runAttempt:Number(process.env.RUN_ATTEMPT), reviewResult: process.env.REVIEW_RESULT,
              runId: context.runId, serverUrl: context.serverUrl,
            });
            core.info(disposition);
            if (['blocked', 'owner-repair-required'].includes(disposition)) core.setFailed(disposition);
