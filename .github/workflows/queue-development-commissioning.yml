name: Queue development commissioning

on:
  push:
    branches:
      - main
    paths:
      - .github/commission-development

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: jarvis-development-commissioning-queue
  cancel-in-progress: false

jobs:
  queue-development-commissioning:
    name: Queue and report guarded development commissioning
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Guard one-shot development request
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ISSUE: "54"
        run: |
          set -euo pipefail

          trigger_file="$GITHUB_WORKSPACE/.github/commission-development"
          if [[ ! -f "$trigger_file" ]]; then
            echo "No active development commissioning request; nothing to queue."
            exit 0
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Development commissioning may be queued only from main."
            exit 1
          fi

          first_line="$(head -n 1 "$trigger_file")"
          if [[ "$first_line" != "COMMISSION DEV" ]]; then
            echo "::error::Trigger file must begin with the exact text COMMISSION DEV."
            exit 1
          fi

          request_id="$(awk -F': ' '$1 == "request-id" { print $2; exit }' "$trigger_file")"
          if [[ ! "$request_id" =~ ^[A-Za-z0-9._:-]{8,128}$ ]]; then
            echo "::error::Trigger file must contain a unique request-id."
            exit 1
          fi

          request_marker="<!-- jarvis-development-commission:${request_id} -->"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE/comments?per_page=100"             --jq '.[].body' | grep -Fqx "$request_marker"; then
            echo "Development commissioning request $request_id was already consumed."
            exit 0
          fi

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Queue guarded commissioning workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ISSUE: "54"
        run: |
          set -euo pipefail

          request_id="${{ steps.guard.outputs.request_id }}"
          request_marker="<!-- jarvis-development-commission:${request_id} -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE/comments" \
            --method POST \
            -f body="$request_marker
Queued from commit $GITHUB_SHA; this request ID is now consumed."

          gh workflow run development-commissioning.yml \
            --ref main \
            --field confirmation='COMMISSION DEV'

          run_id=""
          run_url=""

          for _ in {1..30}; do
            candidate="$({
              gh run list \
                --workflow development-commissioning.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha,url \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | [.databaseId, .url] | @tsv"
            } | head -n 1)"

            if [[ -n "$candidate" ]]; then
              IFS=$'\t' read -r run_id run_url <<<"$candidate"
              break
            fi

            sleep 2
          done

          if [[ -z "$run_id" || -z "$run_url" ]]; then
            echo "::error::Commissioning workflow was dispatched but its run could not be resolved."
            exit 1
          fi

          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "run_url=$run_url" >>"$GITHUB_OUTPUT"

          queued_status="$RUNNER_TEMP/commissioning-queued.md"
          cat >"$queued_status" <<EOF
          # Jarvis development commissioning status

          **Current state: queued**

          - Source: \`$GITHUB_SHA\`
          - Deployment: \`dev:outgoing-ram-798\`
          - Run: $run_url
          - Production deployment: **not authorised and not performed**

          This issue body is the canonical current status. Historical commissioning records remain in the issue comments.
          EOF

          gh issue edit "$STATUS_ISSUE" --body-file "$queued_status"

      - name: Wait for development commissioning
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --exit-status --interval 10

      - name: Report development commissioning result
        if: ${{ always() && steps.dispatch.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          STATUS_ISSUE: "54"
        run: |
          set -euo pipefail

          run_json="$RUNNER_TEMP/commissioning-run.json"
          failed_log="$RUNNER_TEMP/commissioning-failed.log"
          redacted_log="$RUNNER_TEMP/commissioning-failed-redacted.log"
          status_file="$RUNNER_TEMP/commissioning-status.md"

          gh run view "$RUN_ID" \
            --json conclusion,status,url,headSha,createdAt,updatedAt,jobs \
            >"$run_json"

          status="$(jq -r '.status' "$run_json")"
          conclusion="$(jq -r '.conclusion // "pending"' "$run_json")"
          failed_steps="$(jq -r '
            [
              .jobs[]
              | select(.conclusion == "failure")
              | .name as $job
              | .steps[]
              | select(.conclusion == "failure")
              | "- " + $job + " → " + .name
            ]
            | if length == 0 then "- None" else join("\n") end
          ' "$run_json")"

          failed_log_excerpt="- Not applicable"
          if [[ "$conclusion" != "success" ]]; then
            gh run view "$RUN_ID" --log-failed >"$failed_log" 2>&1 || true

            perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g' "$failed_log" \
              | sed -E \
                -e 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' \
                -e 's/(sk-[A-Za-z0-9_-]{12})[A-Za-z0-9_-]+/\1[REDACTED]/g' \
                -e 's/([A-Za-z0-9_-]{24})[A-Za-z0-9_-]{20,}/\1[REDACTED]/g' \
                -e 's/```/` ` `/g' \
              | tail -n 120 >"$redacted_log"

            if [[ -s "$redacted_log" ]]; then
              failed_log_excerpt="$(cat "$redacted_log")"
            else
              failed_log_excerpt="Failed log output was unavailable."
            fi
          fi

          cat >"$status_file" <<EOF
          # Jarvis development commissioning status

          **Current state: ${conclusion}**

          - Source: \`$GITHUB_SHA\`
          - Deployment: \`dev:outgoing-ram-798\`
          - Status: \`${status}\`
          - Conclusion: \`${conclusion}\`
          - Run: ${RUN_URL}
          - Production deployment: **not authorised and not performed**

          ## Failed steps
          ${failed_steps}

          ## Redacted failed-log excerpt
          \`\`\`text
          ${failed_log_excerpt}
          \`\`\`

          This issue body is the canonical current status. Historical commissioning records remain in the issue comments.
          EOF

          gh issue edit "$STATUS_ISSUE" --body-file "$status_file"

          if [[ "$conclusion" != "success" ]]; then
            echo "::warning::Development commissioning concluded with: $conclusion (see issue #54 for canonical status details)"
          fi