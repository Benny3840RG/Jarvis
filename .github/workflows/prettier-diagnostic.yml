name: Prettier diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  capture-prettier-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        working-directory: typescript
        run: npm ci
      - name: Apply pinned formatter
        working-directory: typescript
        run: npm run format
      - name: Capture formatter patch
        run: git diff --binary > prettier.patch
      - name: Upload formatter patch
        uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
      - name: Fail when formatter changed files
        run: test ! -s prettier.patch
