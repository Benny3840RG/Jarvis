name: Source snapshot

on:
  push:
    branches: [agent/fix-json-locks]
    paths:
      - ".github/workflows/source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -cf source-snapshot.tar typescript/src/persistence/persistence.ts typescript/tests/persistence.test.ts typescript/tests/update.persistence.test.ts typescript/src/cli.ts typescript/tests/cli.wiring.test.ts .github/workflows/typescript.yml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.tar
          if-no-files-found: error
