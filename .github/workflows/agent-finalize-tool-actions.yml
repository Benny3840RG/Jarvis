name: Agent finalize tool actions

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/agent-finalize-tool-actions.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Update tool action OpenAPI contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "openapi/jarvis.openapi.json";
          const document = JSON.parse(fs.readFileSync(path, "utf8"));
          document.info.version = "0.6.0";
          document.info.description =
            "Jarvis accepts structured operator requests, routes work through its runtime and safety envelope, persists tasks and reminders through the configured JSON or Convex provider, runs proposal-only Totality reasoning, stages revision-checked project-memory changes, and now stores revision-bound tool-action proposals for explicit approval or rejection without execution. This contract is intentionally single-user and private. The future ChatGPT App MCP server must keep Jarvis and OpenAI service credentials server-side and expose only operations marked with x-mcp-tool.exposed=true.";

          if (!document.tags.some((tag) => tag.name === "Tool Actions")) {
            document.tags.push({
              name: "Tool Actions",
              description:
                "Revision-bound tool-action proposal, inspection, approval, and rejection. Approval does not execute the operation.",
            });
          }
          if (!document["x-jarvis-architecture"].immutableSafetyCategories.includes("tool-action")) {
            document["x-jarvis-architecture"].immutableSafetyCategories.push("tool-action");
          }
          const restOnly = document["x-chatgpt-app"].restOnlyOperationIds;
          for (const operationId of [
            "stageToolAction",
            "listToolActions",
            "getToolAction",
            "approveToolAction",
            "rejectToolAction",
          ]) {
            if (!restOnly.includes(operationId)) restOnly.push(operationId);
          }

          const projectParameter = {
            name: "projectId",
            in: "path",
            required: true,
            schema: { type: "string", minLength: 1, maxLength: 128 },
          };
          const actionParameter = {
            name: "actionId",
            in: "path",
            required: true,
            schema: { type: "string", minLength: 1, maxLength: 128 },
          };
          const mcp = (readOnly, idempotent) => ({
            exposed: false,
            annotations: {
              readOnlyHint: readOnly,
              destructiveHint: false,
              openWorldHint: false,
              idempotentHint: idempotent,
            },
          });
          const success = (description, schemaRef, status = "200") => ({
            [status]: {
              description,
              headers: { "X-Request-Id": { $ref: "#/components/headers/RequestId" } },
              content: {
                "application/json": { schema: { $ref: schemaRef } },
              },
            },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
            "422": { $ref: "#/components/responses/UnprocessableEntity" },
            "500": { $ref: "#/components/responses/InternalServerError" },
            "503": { $ref: "#/components/responses/ServiceUnavailable" },
          });

          document.paths["/api/v1/projects/{projectId}/tool-actions"] = {
            get: {
              operationId: "listToolActions",
              summary: "List revision-bound tool-action proposals",
              description:
                "Returns recent tool-action proposals for one project. This operation cannot execute a tool.",
              tags: ["Tool Actions"],
              parameters: [
                projectParameter,
                {
                  name: "state",
                  in: "query",
                  schema: { $ref: "#/components/schemas/ToolActionState" },
                },
                {
                  name: "limit",
                  in: "query",
                  schema: { type: "integer", minimum: 1, maximum: 100, default: 25 },
                },
              ],
              "x-mcp-tool": mcp(true, true),
              responses: success(
                "Current project tool-action proposals.",
                "#/components/schemas/ToolActionList",
              ),
            },
            post: {
              operationId: "stageToolAction",
              summary: "Stage a tool-action proposal for explicit review",
              description:
                "Stores one idempotent proposal against the authoritative project revision. Staging never calls the named tool.",
              tags: ["Tool Actions"],
              parameters: [projectParameter],
              "x-mcp-tool": mcp(false, true),
              requestBody: {
                required: true,
                content: {
                  "application/json": {
                    schema: { $ref: "#/components/schemas/StageToolActionRequest" },
                  },
                },
              },
              responses: success(
                "Tool-action proposal staged.",
                "#/components/schemas/ToolAction",
                "201",
              ),
            },
          };

          document.paths["/api/v1/projects/{projectId}/tool-actions/{actionId}"] = {
            get: {
              operationId: "getToolAction",
              summary: "Inspect one tool-action proposal",
              description:
                "Returns one proposal and its approval state without invoking the named tool.",
              tags: ["Tool Actions"],
              parameters: [projectParameter, actionParameter],
              "x-mcp-tool": mcp(true, true),
              responses: success("Tool-action proposal.", "#/components/schemas/ToolAction"),
            },
          };

          document.paths["/api/v1/projects/{projectId}/tool-actions/{actionId}/approve"] = {
            post: {
              operationId: "approveToolAction",
              summary: "Approve a revision-matched tool-action proposal",
              description:
                "Records explicit operator approval after checking the project revision. Approval does not execute the proposal.",
              tags: ["Tool Actions"],
              parameters: [projectParameter, actionParameter],
              "x-mcp-tool": mcp(false, true),
              requestBody: {
                required: true,
                content: {
                  "application/json": {
                    schema: { $ref: "#/components/schemas/ExpectedRevisionRequest" },
                  },
                },
              },
              responses: success("Tool-action proposal approved.", "#/components/schemas/ToolAction"),
            },
          };

          document.paths["/api/v1/projects/{projectId}/tool-actions/{actionId}/reject"] = {
            post: {
              operationId: "rejectToolAction",
              summary: "Reject a tool-action proposal",
              description:
                "Records an explicit rejection reason. Rejection does not call the named tool.",
              tags: ["Tool Actions"],
              parameters: [projectParameter, actionParameter],
              "x-mcp-tool": mcp(false, true),
              requestBody: {
                required: true,
                content: {
                  "application/json": {
                    schema: { $ref: "#/components/schemas/RejectToolActionRequest" },
                  },
                },
              },
              responses: success("Tool-action proposal rejected.", "#/components/schemas/ToolAction"),
            },
          };

          const schemas = document.components.schemas;
          schemas.ToolActionState = {
            type: "string",
            enum: ["proposed", "approved", "rejected"],
          };
          schemas.ToolAuthority = {
            type: "string",
            enum: ["T1", "T2", "T3"],
          };
          schemas.ToolAction = {
            type: "object",
            additionalProperties: false,
            required: [
              "actionId",
              "requestId",
              "projectId",
              "baseRevision",
              "state",
              "tool",
              "operation",
              "arguments",
              "rationale",
              "requiredAuthority",
              "destructive",
              "idempotencyKey",
              "proposedBy",
              "createdAt",
              "updatedAt",
            ],
            properties: {
              actionId: { type: "string", minLength: 1, maxLength: 128 },
              requestId: { type: "string", minLength: 1, maxLength: 128 },
              projectId: { type: "string", minLength: 1, maxLength: 128 },
              baseRevision: { type: "integer", minimum: 1 },
              state: { $ref: "#/components/schemas/ToolActionState" },
              tool: { type: "string", minLength: 1, maxLength: 128 },
              operation: { type: "string", minLength: 1, maxLength: 128 },
              arguments: {
                type: "object",
                maxProperties: 64,
                additionalProperties: true,
              },
              rationale: { type: "string", minLength: 1 },
              requiredAuthority: { $ref: "#/components/schemas/ToolAuthority" },
              destructive: { type: "boolean" },
              idempotencyKey: { type: "string", minLength: 1, maxLength: 256 },
              proposedBy: { type: "string", enum: ["user", "agent", "tool"] },
              approvedBy: { const: "user" },
              rejectedBy: { const: "user" },
              rejectedReason: { type: "string", minLength: 1 },
              createdAt: { type: "string", format: "date-time" },
              updatedAt: { type: "string", format: "date-time" },
              approvedAt: { type: "string", format: "date-time" },
              rejectedAt: { type: "string", format: "date-time" },
            },
          };
          schemas.StageToolActionRequest = {
            type: "object",
            additionalProperties: false,
            required: [
              "actionId",
              "expectedRevision",
              "tool",
              "operation",
              "arguments",
              "rationale",
              "requiredAuthority",
              "destructive",
              "idempotencyKey",
              "proposedBy",
            ],
            properties: {
              actionId: { type: "string", minLength: 1, maxLength: 128 },
              expectedRevision: { type: "integer", minimum: 1 },
              tool: { type: "string", minLength: 1, maxLength: 128 },
              operation: { type: "string", minLength: 1, maxLength: 128 },
              arguments: {
                type: "object",
                maxProperties: 64,
                additionalProperties: true,
              },
              rationale: { type: "string", minLength: 1 },
              requiredAuthority: { $ref: "#/components/schemas/ToolAuthority" },
              destructive: {
                type: "boolean",
                description:
                  "When true, requiredAuthority must be T3. This still does not authorise execution.",
              },
              idempotencyKey: { type: "string", minLength: 1, maxLength: 256 },
              proposedBy: { type: "string", enum: ["user", "agent", "tool"] },
            },
          };
          schemas.RejectToolActionRequest = {
            type: "object",
            additionalProperties: false,
            required: ["reason"],
            properties: { reason: { type: "string", minLength: 1 } },
          };
          schemas.ToolActionList = {
            type: "array",
            items: { $ref: "#/components/schemas/ToolAction" },
          };

          fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
      - name: Apply repository formatting
        run: npx prettier --write .
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Commit verified generated changes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex docs openapi src tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "style: finalize tool action approval contract"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
