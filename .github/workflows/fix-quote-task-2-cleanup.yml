name: Fix quote lifecycle task 2 cleanup

on:
  push:
    branches:
      - feat/quote-lifecycle-152
    paths:
      - .github/workflows/fix-quote-task-2-cleanup.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/quote-lifecycle-152
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        working-directory: typescript
        run: npm ci

      - name: Make cleanup fail closed above its bound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("typescript/convex/quotes.ts")
          source = path.read_text()
          old = '''      )
      .take(MAX_CLEANUP_REVISIONS);
    for (const revision of revisions) await ctx.db.delete("quoteRevisions", revision._id);
'''
          new = '''      )
      .take(MAX_CLEANUP_REVISIONS + 1);
    if (revisions.length > MAX_CLEANUP_REVISIONS) {
      throw new Error("Quote cleanup exceeded the bounded revision limit.");
    }
    for (const revision of revisions) await ctx.db.delete("quoteRevisions", revision._id);
'''
          if old not in source:
              raise SystemExit("cleanup replacement marker missing")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Format and verify
        working-directory: typescript
        run: |
          npm exec prettier -- --write convex/quotes.ts
          npm run type-check
          npm run lint

      - name: Remove helper and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/fix-quote-task-2-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(quotes): prevent partial development cleanup"
          git push origin HEAD:feat/quote-lifecycle-152
          gh pr comment 174 --body "Task 2 cleanup review fix passed in run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; helper removed itself."
