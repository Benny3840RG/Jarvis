<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis HUD local preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <iframe id="hud" title="Jarvis HUD" src="./dashboard-v1.html"></iframe>
    <script>
      const SNAPSHOT = {
        presence: "waiting_for_approval",
        status: {
          status: "ok",
          version: "0.1.0",
          sourceVersion: "hud-local-preview",
          provider: {
            name: "json",
            reachability: "ok",
            authentication: "not-required",
            schemaCompatibility: "compatible",
            deploymentVersion: "local-preview",
          },
          reconciliation: { state: "disabled", enabled: false },
          integrations: [
            { name: "quote-delivery", status: "not-commissioned", reason: "Outlook OAuth not commissioned" },
            { name: "posthog", status: "not-commissioned", reason: "Live ingestion not proven" },
            { name: "sentry", status: "not-commissioned", reason: "Live alerts not proven" },
          ],
          timezone: "Australia/Melbourne",
          layers: {
            runtime: { status: "ready" },
            domains: { status: "ready" },
            integration: { status: "partial" },
            orchestration: { status: "ready" },
            safety: { status: "ready" },
            adaptive: { status: "inactive" },
            autonomy: { status: "partial" },
            reliability: { status: "ready" },
          },
          zState: "active",
          checkedAt: new Date().toISOString(),
        },
        tasks: [
          { id: "t1", title: "Prepare Frankston hedge quote", completed: false, category: "work", createdAt: 1 },
          { id: "t2", title: "Buy green-waste bags", completed: false, category: "work", createdAt: 2 },
          { id: "t3", title: "Service chipper", completed: true, category: "builds", createdAt: 3 },
        ],
        reminders: [
          { id: "r1", title: "Call Marilyn about access gate", dueRaw: "Tomorrow 8am", dueAt: Date.now() + 86400000, createdAt: 1 },
          { id: "r2", title: "Invoice 14 follow-up", dueRaw: "Friday", dueAt: Date.now() + 3 * 86400000, createdAt: 2 },
        ],
        brief: {
          generatedAt: new Date().toISOString(),
          timezone: "Australia/Melbourne",
          headline: "PREVIEW FIXTURE · not live Jarvis data. 2 open tasks, 1 enquiry, 1 invoice outstanding.",
          reminders: { dueCount: 0, upcomingCount: 1, undatedCount: 0, due: [], upcoming: [] },
          projects: {
            activeCount: 1,
            countsByStatus: { lead: 0, quoted: 1, active: 1, on_hold: 0, done: 0 },
            active: [{ id: "project-1", clientId: "c1", title: "Frankston garden rebuild", status: "active", createdAt: 1, updatedAt: 2 }],
          },
          quotes: { countsByStatus: { draft: 1, sent: 1, accepted: 0, declined: 0 }, pipelineTotal: 3300.5, acceptedTotal: 0, awaitingResponse: [], drafts: [] },
          maintenance: { dueCount: 1, dueSoonCount: 0, due: [{ name: "Chipper", kind: "equipment" }], dueSoon: [] },
        },
        quoteRegister: {
          status: "ready",
          quotes: [
            { quoteId: "q1", clientId: "c1", projectId: "project-1", number: "174", currentRevision: 2, aggregateVersion: 4, revisionStatus: "finalized", commercialStatus: "open", total: 3300.5, currency: "AUD", updatedAt: 3 },
            { quoteId: "q2", clientId: "c1", projectId: "project-1", number: "175", currentRevision: 1, aggregateVersion: 1, revisionStatus: "draft", commercialStatus: "open", total: 880, currency: "AUD", updatedAt: 4 },
          ],
        },
        inbox: {
          generatedAt: new Date().toISOString(),
          items: [
            { itemId: "invoice-outstanding:inv-14", kind: "invoice-outstanding", severity: "elevated", title: "Invoice 14 partial", explanation: "Balance due remains on issued invoice 14." },
          ],
          sources: [
            { source: "reminders", status: "available", checkedAt: new Date().toISOString() },
            { source: "toolActions", status: "available", checkedAt: new Date().toISOString() },
          ],
        },
        activity: {
          status: "available",
          events: [
            { activityId: "a1", occurredAt: new Date().toISOString(), eventType: "tool.action.proposed", actor: "agent", summary: "Tool action proposed: send quote 174." },
          ],
          cursor: "",
          isDone: true,
        },
        approvals: {
          status: "ready",
          items: [
            {
              actionId: "act-1",
              requestId: "req-1",
              projectId: "project-1",
              baseRevision: 4,
              state: "proposed",
              tool: "quoteSendTool",
              operation: "quotes:send",
              arguments: { quoteId: "q1" },
              rationale: "Send finalised quote 174 to Marilyn after owner review.",
              requiredAuthority: "T2",
              destructive: false,
              idempotencyKey: "preview-1",
              proposedBy: "agent",
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              approvalExpiryPolicy: "ttl",
              approvalExpiresAt: new Date(Date.now() + 3600000).toISOString(),
            },
          ],
        },
        business: {
          clients: { status: "ready", items: [{ id: "c1", name: "Marilyn Frankston", contacts: [{ value: "marilyn@example.test" }], createdAt: 1, updatedAt: 1 }] },
          properties: { status: "ready", items: [{ id: "p1", clientId: "c1", address: "12 Banksia Ct, Frankston VIC", hazards: ["Steep driveway", "Power line near trees"], accessNotes: "Side gate code with owner", createdAt: 1, updatedAt: 1 }] },
          enquiries: { status: "ready", items: [{ id: "e1", clientId: "c1", propertyId: "p1", source: "phone", requestedWork: "Remove storm-damaged limb", urgency: "urgent", status: "open", createdAt: 1, updatedAt: 1 }] },
          invoices: { status: "ready", items: [{ id: "inv-14", clientId: "c1", number: "14", status: "issued", paymentStatus: "partial", total: 2200, amountPaid: 800, balanceDue: 1400, dueDate: "2026-08-28", createdAt: 1, updatedAt: 2 }] },
        },
        counts: { activeTasks: 2, completedTasks: 1, reminders: 2 },
      };
      const QUOTE = {
        aggregate: {
          quoteId: "q1",
          ownerId: "owner-1",
          clientId: "c1",
          projectId: "project-1",
          number: "174",
          currentRevision: 3,
          currentRevisionId: "revision-3",
          aggregateVersion: 4,
          commercialStatus: "open",
          createdAt: 10,
          updatedAt: 20,
        },
        revision: {
          revisionId: "revision-3",
          ownerId: "owner-1",
          quoteId: "q1",
          revision: 3,
          revisionVersion: 3,
          status: "finalized",
          lineItems: [
            { description: "Hedge reduction", quantity: 1, unitPrice: 1800.25 },
            { description: "Green waste", quantity: 1, unitPrice: 1500.25 },
          ],
          subtotal: 3300.5,
          tax: 0,
          total: 3300.5,
          currency: "AUD",
          validUntil: "2026-09-30",
          notes: "Marilyn's finalised quote is ready to send.",
          termsIncluded: true,
          createdAt: 10,
          updatedAt: 20,
        },
      };

      const frame = document.getElementById("hud");
      const params = new URLSearchParams(location.search);
      const view = params.get("view");
      const failQuote = params.get("failQuote") === "1";
      if (view) frame.src = `./dashboard-v1.html#${encodeURIComponent(view)}`;
      function pushSnapshot(target) {
        target.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: SNAPSHOT }, "*");
      }
      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow || !event.data || event.data.jsonrpc !== "2.0") return;
        const { id, method } = event.data;
        if (typeof id !== "number") return;
        if (method === "ui/initialize") {
          event.source.postMessage({ jsonrpc: "2.0", id, result: {} }, "*");
          pushSnapshot(event.source);
          return;
        }
        if (method === "tools/call") {
          const name = event.data.params && event.data.params.name;
          if (name === "show_jarvis_dashboard" || name === "get_jarvis_status") {
            event.source.postMessage({ jsonrpc: "2.0", id, result: { structuredContent: SNAPSHOT } }, "*");
            return;
          }
          if (name === "get_quote") {
            if (failQuote) {
              event.source.postMessage({ jsonrpc: "2.0", id, result: { isError: true, content: [{ type: "text", text: "Quote read failed." }] } }, "*");
              return;
            }
            const quoteId = event.data.params && event.data.params.arguments && event.data.params.arguments.quoteId;
            if (quoteId === "q1") {
              event.source.postMessage({ jsonrpc: "2.0", id, result: { structuredContent: { quote: QUOTE } } }, "*");
              return;
            }
            event.source.postMessage({ jsonrpc: "2.0", id, result: { isError: true, content: [{ type: "text", text: "Quote not found." }] } }, "*");
            return;
          }
          if (name === "approve_tool_action" || name === "reject_tool_action") {
            event.source.postMessage({
              jsonrpc: "2.0",
              id,
              result: { isError: true, content: [{ type: "text", text: "Preview host does not execute governed approval." }] },
            }, "*");
            return;
          }
          event.source.postMessage({
            jsonrpc: "2.0",
            id,
            result: { isError: true, content: [{ type: "text", text: "Preview host only loads the dashboard snapshot." }] },
          }, "*");
        }
      });
    </script>
  </body>
</html>
