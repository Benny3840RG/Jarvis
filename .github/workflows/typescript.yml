name: TypeScript checks

# This is the required CI gate for the main branch and all pull requests targeting main.
# The `typecheck-lint-format-test` job must pass before any PR can be merged.
# See docs/operations/ci-health.md for diagnostics and docs/operations/branch-protection.md
# for required branch protection settings.

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"

permissions:
  contents: read

jobs:
  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Test interactive CLI and persistence with coverage
        run: npm run test:coverage

  jarvis-console-01-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/jarvis-console-01
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/jarvis-console-01/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check the MCP app
        run: npm run build
