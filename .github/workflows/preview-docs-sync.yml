name: Synchronise preview documentation

on:
  push:
    branches:
      - feat/chatgpt-preview
    paths:
      - .github/workflows/preview-docs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-preview
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      - name: Update README and OpenAPI metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old = '''The versioned implementation target for Jarvis's HTTP and ChatGPT App adapters is
          [`typescript/openapi/jarvis.openapi.json`](typescript/openapi/jarvis.openapi.json). The
          maintained TypeScript CLI remains available, and the first HTTP adapter slice now implements
          public liveness plus authenticated help, provider/Z-State status checks, and durable task
          operations. Reminder operations are now implemented; conversation, backup, and MCP routes remain
          contract-only until their focused implementation stages are complete.'''
          new = '''The versioned implementation contract for Jarvis's HTTP and private ChatGPT App adapters is
          [`typescript/openapi/jarvis.openapi.json`](typescript/openapi/jarvis.openapi.json). The
          maintained TypeScript CLI remains available. The HTTP adapter implements liveness, authenticated
          help, provider/Z-State status, Totality reasoning, staged memory and tool-action approvals,
          durable tasks and reminders, plus provider-neutral backup operations. The private development
          preview now implements a stateless Streamable HTTP MCP endpoint and versioned operator-console
          widget for the operations explicitly marked as MCP-exposed.'''
          if old not in readme:
              raise SystemExit('README implementation paragraph was not found.')
          readme = readme.replace(old, new, 1)

          anchor = '''It listens on `127.0.0.1:3000` by default. See
          [`typescript/docs/operators/http-api.md`](typescript/docs/operators/http-api.md) for endpoint,
          security, status, and configuration details.
          '''
          section = '''It listens on `127.0.0.1:3000` by default. See
          [`typescript/docs/operators/http-api.md`](typescript/docs/operators/http-api.md) for endpoint,
          security, status, and configuration details.

          ### Controlled ChatGPT preview

          Start the commissioned Jarvis HTTP service and private MCP preview together:

          ```bash
          cd typescript
          npm run start:preview
          ```

          The MCP endpoint binds to `127.0.0.1:8787/mcp` by default and injects the Jarvis service token
          server-side. The model, widget and tool arguments never receive it. See
          [`typescript/docs/operators/chatgpt-preview.md`](typescript/docs/operators/chatgpt-preview.md)
          for the local runbook, Developer Mode connection steps, remote-binding guard and scope limits.
          '''
          if anchor not in readme:
              raise SystemExit('README HTTP anchor was not found.')
          readme_path.write_text(readme.replace(anchor, section, 1))

          openapi_path = Path('typescript/openapi/jarvis.openapi.json')
          document = json.loads(openapi_path.read_text())
          document['info']['description'] = (
              'Jarvis accepts structured operator requests, routes work through its runtime and safety '
              'envelope, persists tasks and reminders through the configured JSON or Convex provider, runs '
              'proposal-only Totality reasoning, stages revision-checked project-memory changes, and stores '
              'revision-bound tool-action proposals for explicit approval or rejection without execution. '
              'The private development ChatGPT App preview now provides a stateless Streamable HTTP MCP '
              'adapter and versioned dashboard widget for the operations marked with '
              'x-mcp-tool.exposed=true. Jarvis and OpenAI credentials remain server-side. This contract is '
              'intentionally single-user and private.'
          )
          document['info']['version'] = '0.7.0'
          app = document['x-chatgpt-app']
          app['implementationStatus'] = 'private-development-preview'
          app['transport'] = 'streamable-http-stateless'
          app['localDefaultEndpoint'] = 'http://127.0.0.1:8787/mcp'
          app['runbook'] = 'typescript/docs/operators/chatgpt-preview.md'
          openapi_path.write_text(json.dumps(document, indent=2) + '\n')
          PY
      - working-directory: typescript
        run: npm run format
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md typescript/openapi/jarvis.openapi.json
          git commit -m "docs: publish controlled preview runbook"
          git push origin HEAD:feat/chatgpt-preview
