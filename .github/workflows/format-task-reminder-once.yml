name: Format task and reminder branch once

on:
  push:
    branches:
      - feat/task-reminder-actions-155
    paths:
      - ".github/workflows/format-task-reminder-once.yml"

permissions:
  contents: write

concurrency:
  group: jarvis-task-reminder-format-once
  cancel-in-progress: false

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/task-reminder-actions-155
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install locked dependencies
        working-directory: typescript
        run: npm ci
      - name: Apply pinned formatter
        working-directory: typescript
        run: npm run format
      - name: Remove one-shot workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/format-task-reminder-once.yml
          git config user.name "jarvis-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add typescript docs/superpowers/plans/2026-07-24-task-reminder-actions.md
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style(actions): apply pinned task and reminder formatting"
          git push origin HEAD:feat/task-reminder-actions-155
