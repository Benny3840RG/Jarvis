# Catalog of state targets referenced by
# docs/traceability/action-family-registry.yaml#action_families[].bindings.state_target_id.
#
# `implemented` reflects whether the required durable store and state semantics
# exist in the codebase today. A broad entity store may exist while a specific
# action transition remains planned, as with the current Quote domain.
schema_version: "1.0"

state_targets:
  - id: STORE-NOTES
    lifecycle_status: active
    implemented: true
    description: Owner/project-scoped durable Convex notes with sensitivity, retention, revision, source, correlation and idempotency metadata.
    implementation:
      - typescript/convex/schema.ts
      - typescript/convex/notes.ts
      - typescript/src/persistence/convexNotes.ts
    bound_by: [AM-003]

  - id: STORE-QUOTES
    lifecycle_status: planned
    implemented: true
    note: Real QuoteStore (src/quotes/quote.ts) exists but only supports draft|sent|accepted|declined — no finalized/reviewed states yet, so the finalize/send transitions AM-012/AM-013 need remain unimplemented.
    bound_by: [AM-012, AM-013]
