name: TypeScript checks

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

jobs:
  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Generate exact Prettier patch
        run: |
          npm run format
          git diff -- . > ../prettier.patch
          test -s ../prettier.patch
      - name: Upload Prettier patch
        uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
          retention-days: 1
      - name: Stop after diagnostics
        run: exit 1
