name: Format final memory approval files

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/tests/memoryChangeSetHttp.test.ts"
      - "typescript/docs/operators/memory-approval.md"
      - ".github/workflows/format-memory-final.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/memory-approval-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      - name: Format final files
        working-directory: typescript
        run: npx prettier tests/memoryChangeSetHttp.test.ts docs/operators/memory-approval.md --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/tests/memoryChangeSetHttp.test.ts typescript/docs/operators/memory-approval.md
          git commit -m "style: format memory approval docs and tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
