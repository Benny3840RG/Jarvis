# Catalog of TEST-* IDs that action families in
# docs/traceability/action-family-registry.yaml may reference under
# traceability.test_ids. Each ID names committed verification code.
schema_version: "1.0"

tests:
  - id: TEST-AM-003-001
    path: typescript/tests/createNoteTool.test.ts
    verifies: successful note creation, exact receipt replay, replay after a fresh execution service, and insufficient-authority blocking

  - id: TEST-AM-003-NEG-001
    path: typescript/tests/createNoteTool.test.ts
    verifies: malformed input, dry-run non-mutation, changed-payload fingerprint mismatch, and exact allowlist enforcement

  - id: TEST-AM-003-PERSIST-001
    path: typescript/tests/convexNotes.test.ts
    verifies: authenticated create, read, list, remove, record mapping, and service-token enforcement

  - id: TEST-AM-003-SMOKE-001
    path: typescript/tests/notesSmoke.test.ts
    verifies: fresh-store visibility, idempotent replay, self-cleaning failure recovery, and refusal of non-development deployments

  - id: TEST-AM-004-DOMAIN-001
    path: typescript/tests/controlledTaskActions.test.ts
    verifies: task create exact replay, fingerprint collision rejection, project isolation, and initial revision semantics
  - id: TEST-AM-004-TOOL-001
    path: typescript/tests/taskReminderAllowlist.test.ts
    verifies: tasks:create strict schema, immutable execution context, authority, dry-run and exact allowlist enforcement
  - id: TEST-AM-004-PERSIST-001
    path: typescript/tests/convexControlledTasks.test.ts
    verifies: authenticated task creation, mapping, project scope and cleanup adapter calls
  - id: TEST-AM-004-SMOKE-001
    path: typescript/tests/taskReminderActionsSmoke.test.ts
    verifies: task create, fresh-instance replay, fresh visibility and self-cleaning development execution

  - id: TEST-AM-005-DOMAIN-001
    path: typescript/tests/controlledTaskActions.test.ts
    verifies: atomic completion decision, exact completion replay, stale completion rejection and revision advancement
  - id: TEST-AM-005-TOOL-001
    path: typescript/tests/taskReminderAllowlist.test.ts
    verifies: tasks:complete strict target validation, stale or inaccessible target failure and unreviewed operation blocking
  - id: TEST-AM-005-PERSIST-001
    path: typescript/tests/convexControlledTasks.test.ts
    verifies: authenticated complete, get and cleanup adapter context and null preservation
  - id: TEST-AM-005-SMOKE-001
    path: typescript/tests/taskReminderActionsSmoke.test.ts
    verifies: live task completion, retained replay result, fresh visibility and cleanup

  - id: TEST-AM-006-DOMAIN-001
    path: typescript/tests/controlledReminderActions.test.ts
    verifies: reminder create exact replay, fingerprint collision rejection, project isolation and due metadata preservation
  - id: TEST-AM-006-TOOL-001
    path: typescript/tests/taskReminderAllowlist.test.ts
    verifies: reminders:create due-field coupling, authority, dry-run and exact allowlist enforcement
  - id: TEST-AM-006-PERSIST-001
    path: typescript/tests/convexControlledReminders.test.ts
    verifies: authenticated reminder creation, optional due mapping, project scope and cleanup adapter calls
  - id: TEST-AM-006-SMOKE-001
    path: typescript/tests/taskReminderActionsSmoke.test.ts
    verifies: reminder create, fresh-instance replay, fresh visibility and self-cleaning development execution

  - id: TEST-AM-007-DOMAIN-001
    path: typescript/tests/controlledReminderActions.test.ts
    verifies: cancellation tombstone retention, live-record deletion, exact replay, collision rejection and stale cancellation behaviour
  - id: TEST-AM-007-TOOL-001
    path: typescript/tests/taskReminderAllowlist.test.ts
    verifies: reminders:cancel target validation, execution-context propagation and rejection outside the reviewed allowlist
  - id: TEST-AM-007-PERSIST-001
    path: typescript/tests/convexControlledReminders.test.ts
    verifies: authenticated cancel, retained result mapping, get and cleanup adapter context
  - id: TEST-AM-007-SMOKE-001
    path: typescript/tests/taskReminderActionsSmoke.test.ts
    verifies: live cancellation tombstone replay after deletion and authenticated post-run cleanup

  - id: TEST-AM-012-DOMAIN-001
    path: typescript/tests/quoteConvexLifecycle.test.ts
    verifies: reviewed→finalized transition, draft→finalized rejection, immutability enforcement, optimistic concurrency and fingerprint computation
  - id: TEST-AM-012-PERSIST-001
    path: typescript/convex/quotes.test.ts
    verifies: finalizeRevision Convex mutation, owner-scoped lookup, stale-version rejection and fingerprint persistence
  - id: TEST-AM-012-TOOL-001
    path: typescript/tests/quoteFinalizeTool.test.ts
    verifies: TOOL-QUOTE-FINALIZE boundary definition, authority enforcement and allowlist exclusion (planned evidence path; not yet commissioned)
  - id: TEST-AM-012-SMOKE-001
    path: typescript/tests/quoteLifecycleSmoke.test.ts
    verifies: full quote create→review→finalize→fork→delivery lifecycle against in-memory adapters and the development deployment (planned evidence path; not yet commissioned)

  - id: TEST-AM-013-DELIVERY-001
    path: typescript/convex/quoteDeliveries.test.ts
    verifies: createPending idempotency, send-scope fingerprint collision rejection, status transitions and no-blind-retry enforcement
  - id: TEST-AM-013-RECONCILIATION-001
    path: typescript/tests/quoteSendTool.test.ts
    verifies: provider external-execution integration, indeterminate handling, reconciliation binding and approved-fingerprint gate
  - id: TEST-AM-013-APPROVAL-001
    path: typescript/tests/quoteSendTool.test.ts
    verifies: approval-fingerprint binding, changed-content rejection under same idempotency key and duplicate-send dedup
  - id: TEST-AM-013-SMOKE-001
    path: typescript/tests/quoteLifecycleSmoke.test.ts
    verifies: delivery pending→executing→indeterminate→reconciled lifecycle and commercial-status preservation against in-memory adapters (planned evidence path; not yet commissioned)

  - id: TEST-OS-CI-001-001
    path: typescript/convex/omegaCompletionTruthSecurity.test.ts
    verifies: compatibility criterion projections cannot authorise completion without a current passing proof
  - id: TEST-OS-CI-002-001
    path: typescript/convex/omegaCompletionTruthSecurity.test.ts
    verifies: every proof reference must resolve to current same-mission evidence before completion
  - id: TEST-OS-CI-003-001
    path: typescript/convex/omegaValidationSecurity.test.ts
    verifies: R3/R4 independent validation requires the dedicated approval credential
  - id: TEST-OS-CI-004-001
    path: typescript/tests/omegaPolicy.test.ts
    verifies: failed, waived and inconclusive proof outcomes remain fail-closed
  - id: TEST-OS-CI-005-001
    path: typescript/convex/omegaCompletionTruthSecurity.test.ts
    verifies: current certain contradiction edges and dangling legacy edges block completion
  - id: TEST-OS-CI-006-001
    path: typescript/convex/omegaContradictionResolutions.test.ts
    verifies: contradiction resolution is immutable, append-only and bound to one exact edge
  - id: TEST-OS-CI-007-001
    path: typescript/convex/omegaContradictionResolutions.test.ts
    verifies: resolution requires separate approval authority and a non-empty reviewer identity
  - id: TEST-OS-CI-008-001
    path: typescript/convex/omegaContradictionResolutions.test.ts
    verifies: resolution replay is idempotent, changed contents conflict, duplicate edges reject and races have one durable winner
  - id: TEST-OS-CI-009-001
    path: typescript/convex/omegaCompletionTruthSecurity.test.ts
    verifies: legacy mission projections remain readable while completion ignores stale or fabricated values
  - id: TEST-OS-CI-010-001
    path: typescript/tests/omegaPolicy.test.ts
    verifies: unreconciled external effects deny completion through the existing policy boundary
  - id: TEST-OS-CI-011-001
    path: typescript/convex/omegaMissions.ts
    verifies: completion reads are owner/mission indexed and bounded for proofs, evidence, contracts and resolutions
  - id: TEST-OS-CI-012-001
    path: docs/traceability/omega-completion-integrity-tdd.md
    verifies: the increment is repository-only and records no deployment, commissioning or production-authorisation change
