name: Verify bounded Console pagination

on:
  push:
    branches:
      - feat/bounded-console-pagination
    paths:
      - "typescript/**"
      - ".github/workflows/verify-bounded-console-pagination.yml"

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install locked root dependencies
        run: npm ci
      - name: Root TypeScript type-check
        run: npm run type-check
      - name: Root lint
        run: npm run lint
      - name: Root formatting
        run: npm run format:check
      - name: OpenAPI lint
        run: npm run openapi:lint
      - name: Full Node test suite
        run: npm run test:node
      - name: Persisted Convex pagination tests
        run: npx --no-install vitest run --config vitest.config.mts convex/pagination.test.ts

  persisted-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install locked root dependencies
        run: npm ci
      - name: Persisted Convex pagination tests
        run: npx --no-install vitest run --config vitest.config.mts convex/pagination.test.ts

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript/jarvis-console-01
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/jarvis-console-01/package-lock.json
      - name: Install locked Console 01 dependencies
        run: npm ci
      - name: Console pagination tests
        run: npm test
      - name: Console 01 build
        run: npm run build
      - name: Console 01 type-check
        run: npm run type-check
