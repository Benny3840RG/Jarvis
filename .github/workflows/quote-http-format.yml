name: Quote HTTP format helper

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/tests/quoteHttpLifecycle.test.ts"
      - ".github/workflows/quote-http-format.yml"

permissions:
  contents: read

jobs:
  format-file:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Format Task 4 RED test
        run: npx prettier --write tests/quoteHttpLifecycle.test.ts
      - name: Upload formatted test
        uses: actions/upload-artifact@v4
        with:
          name: quote-http-formatted
          path: typescript/tests/quoteHttpLifecycle.test.ts
          if-no-files-found: error
