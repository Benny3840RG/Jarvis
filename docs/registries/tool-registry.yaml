# Catalog of tool executor bindings referenced by
# docs/traceability/action-family-registry.yaml#action_families[].bindings.executor_id.
#
# `implemented` records whether reviewed implementation code and an explicit
# allowlist binding exist. `lifecycle_status` remains planned until that binding
# is deployed to the authorised development target and its live commissioning
# smoke and evidence gates pass.
schema_version: "1.0"

tools:
  - id: TOOL-NOTES-CREATE
    lifecycle_status: active
    implemented: true
    description: Owner/project-scoped durable note creation through the single reviewed notes:create allowlist binding, commissioned on dev:outgoing-ram-798.
    implementation: typescript/src/actions/createNoteTool.ts
    allowlist: typescript/src/actions/toolExecutionFactory.ts
    bound_by: [AM-003]

  - id: TOOL-TASKS-CREATE
    lifecycle_status: active
    implemented: true
    description: Creates owner/project-scoped durable tasks through the reviewed tasks:create allowlist binding, commissioned on dev:outgoing-ram-798.
    implementation: typescript/src/actions/taskReminderTools.ts
    adapter: typescript/src/persistence/convexControlledTasks.ts
    allowlist: typescript/src/actions/toolExecutionFactory.ts
    bound_by: [AM-004]

  - id: TOOL-TASKS-COMPLETE
    lifecycle_status: active
    implemented: true
    description: Atomically completes an owner/project-scoped task with fingerprint-bound replay through tasks:complete, commissioned on dev:outgoing-ram-798.
    implementation: typescript/src/actions/taskReminderTools.ts
    adapter: typescript/src/persistence/convexControlledTasks.ts
    allowlist: typescript/src/actions/toolExecutionFactory.ts
    bound_by: [AM-005]

  - id: TOOL-REMINDERS-CREATE
    lifecycle_status: active
    implemented: true
    description: Creates owner/project-scoped durable reminders with preserved and normalized due metadata through reminders:create, commissioned on dev:outgoing-ram-798.
    implementation: typescript/src/actions/taskReminderTools.ts
    adapter: typescript/src/persistence/convexControlledReminders.ts
    allowlist: typescript/src/actions/toolExecutionFactory.ts
    bound_by: [AM-006]

  - id: TOOL-REMINDERS-CANCEL
    lifecycle_status: active
    implemented: true
    description: Cancels owner/project-scoped reminders through a T3-approved fingerprint-bound tombstone mutation before deleting the live record, commissioned on dev:outgoing-ram-798.
    implementation: typescript/src/actions/taskReminderTools.ts
    adapter: typescript/src/persistence/convexControlledReminders.ts
    allowlist: typescript/src/actions/toolExecutionFactory.ts
    bound_by: [AM-007]

  - id: TOOL-QUOTE-FINALIZE
    lifecycle_status: planned
    implemented: false
    description: Would transition a quote from draft/reviewed to finalized. The real Quote domain (src/quotes/quote.ts) has no finalize/reviewed states today.
    bound_by: [AM-012]

  - id: TOOL-QUOTE-SEND
    lifecycle_status: planned
    implemented: false
    description: Would send a finalized quote to a recipient and reconcile provider status. No send/delivery tool exists in the codebase today.
    bound_by: [AM-013]
