name: Activate AM-003

on:
  push:
    branches:
      - feat/am-003-create-note-150

permissions:
  contents: write

jobs:
  activate:
    if: github.event.head_commit.message != 'docs(governance): activate AM-003 action family'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/am-003-create-note-150

      - name: Activate only AM-003 and attach traceability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/traceability/action-family-registry.yaml')
          text = path.read_text(encoding='utf-8')
          before, after = text.split('  - id: AM-012', 1)

          old_header = '''  - id: AM-003
              name: Create note
              lifecycle_status: planned'''.replace('          ', '')
          new_header = '''  - id: AM-003
              name: Create note
              lifecycle_status: active'''.replace('          ', '')
          if old_header not in before:
              raise SystemExit('AM-003 planned header not found exactly once')
          before = before.replace(old_header, new_header, 1)

          old_trace = '''      test_ids: []
              evidence_ids: []'''.replace('          ', '')
          new_trace = '''      test_ids:
                - TEST-AM-003-001
                - TEST-AM-003-NEG-001
                - TEST-AM-003-PERSIST-001
              evidence_ids:
                - EVD-AM-003-001'''.replace('          ', '')
          if old_trace not in before:
              raise SystemExit('AM-003 empty traceability block not found')
          before = before.replace(old_trace, new_trace, 1)

          path.write_text(before + '  - id: AM-012' + after, encoding='utf-8')
          PY

      - name: Regenerate non-authoritative action map
        run: ruby scripts/generate-action-map.rb

      - name: Commit activation artifacts
        run: |
          git config user.name 'jarvis-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/traceability/action-family-registry.yaml docs/traceability/action-map.generated.md
          git commit -m 'docs(governance): activate AM-003 action family'
          git push origin HEAD:feat/am-003-create-note-150
