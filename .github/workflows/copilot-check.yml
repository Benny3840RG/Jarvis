name: Copilot Review Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  copilot-review-section:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify the Copilot Review section is filled in and tests accompany source changes
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");

            const validatorUrl = pathToFileURL(
              path.join(process.cwd(), ".github/automation/validate-copilot-review.mjs"),
            ).href;
            const {
              resolveReviewSource,
              validateSourceTestCoverage,
            } = await import(validatorUrl);

            const prBody = context.payload.pull_request.body || "";
            let updateBody = "";
            const updatePath = path.join(process.cwd(), ".github/pull_request_update");
            if (fs.existsSync(updatePath)) {
              updateBody = fs.readFileSync(updatePath, "utf8");
            }

            const { failures: reviewFailures, reviewSource } = resolveReviewSource(
              prBody,
              updateBody,
            );
            const failures = [...reviewFailures];

            if (reviewFailures.length === 0) {
              core.info(`Accepted Copilot Review from ${reviewSource}.`);
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.map((file) => file.filename);
            failures.push(...validateSourceTestCoverage(paths));

            if (failures.length > 0) {
              core.setFailed(failures.join("\n"));
            } else {
              core.info(`Copilot Review check passed using ${reviewSource}.`);
            }
