name: Type-check diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typecheck-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - name: Capture type-check
        run: |
          set +e
          npm run type-check > ../typecheck.log 2>&1
          status=$?
          echo "$status" > ../typecheck.status
          exit 0
        working-directory: typescript
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: |
            typecheck.log
            typecheck.status
          if-no-files-found: error
