name: Generate tooling lock

on:
  push:
    branches: [agent/eslint-format-checks]
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/generate-tooling-lock.yml"

permissions:
  contents: write

jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Generate package lock
        working-directory: typescript
        run: npm install --package-lock-only

      - name: Install generated dependency graph
        working-directory: typescript
        run: npm ci

      - name: Format working tree
        working-directory: typescript
        run: npm run format

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: typescript
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../lint.log

      - name: Type-check
        id: typecheck
        continue-on-error: true
        working-directory: typescript
        run: npm run type-check

      - name: Test
        id: test
        continue-on-error: true
        working-directory: typescript
        run: npm test

      - name: Commit generated lock and formatting
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/package-lock.json typescript/src typescript/tests typescript/convex
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock and format lint tooling"
            git push
          fi

      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output-${{ github.run_id }}
          if-no-files-found: error
          path: lint.log

      - name: Fail when checks failed
        if: steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1
