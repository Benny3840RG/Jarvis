name: Apply contract formatting

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

permissions:
  contents: write

jobs:
  apply-contract-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        working-directory: typescript
        run: npm ci
      - name: Format generated contract files
        working-directory: typescript
        run: npx prettier openapi/jarvis.openapi.json tests/http.test.ts --write
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/openapi/jarvis.openapi.json typescript/tests/http.test.ts
          git diff --cached --check
          git commit -m "style: format Totality HTTP contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
