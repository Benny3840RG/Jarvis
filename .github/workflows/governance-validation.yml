name: Governance validation

on:
  pull_request:
    paths:
      - 'docs/requirements/**'
      - 'docs/traceability/**'
      - 'docs/governance/**'
      - 'scripts/generate-action-map.rb'
      - '.github/workflows/governance-validation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/requirements/**'
      - 'docs/traceability/**'
      - 'docs/governance/**'
      - 'scripts/generate-action-map.rb'
      - '.github/workflows/governance-validation.yml'

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/governance/README.md
            docs/requirements/requirements.yaml
            docs/requirements/jarvis-requirements-v2.2.md
            docs/requirements/state-glossary.md
            docs/traceability/requirements-matrix.md
            docs/traceability/test-matrix.md
            docs/traceability/evidence-matrix.md
            docs/traceability/action-family-registry.yaml
            docs/traceability/action-map.generated.md
            docs/governance/decision-register.md
            docs/governance/gap-register.md
            docs/governance/risk-register.md
            docs/governance/handover-dossier.md
            scripts/generate-action-map.rb
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required governance artifact: $file"; exit 1; }
          done

      - name: Validate generated action map
        run: ruby scripts/generate-action-map.rb --check

      - name: Validate frozen namespace and deployment boundary
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          authority = Path('docs/requirements/requirements.yaml').read_text()
          index = Path('docs/governance/README.md').read_text()
          risks = Path('docs/governance/risk-register.md').read_text()

          required_authority_fragments = [
              'frozen_start: R-001',
              'frozen_end: R-150',
              'development_target: dev:outgoing-ram-798',
              'production_deployment: prohibited_without_explicit_production_specific_approval',
              'approvals_bind_to_exact_action_fingerprints: true',
              'ids_never_recycled: true',
              'generated_action_map_read_only: true',
          ]
          missing = [item for item in required_authority_fragments if item not in authority]
          if missing:
              print('Missing canonical controls:', *missing, sep='\n- ')
              sys.exit(1)

          required_index_fragments = [
              'authority: navigational_only',
              'namespace: R-001–R-150',
              'Where artifacts conflict, the higher-ranked artifact governs.',
              'Never deploy to Convex production without Benny',
          ]
          missing = [item for item in required_index_fragments if item not in index]
          if missing:
              print('Missing governance-index controls:', *missing, sep='\n- ')
              sys.exit(1)

          risk_ids = re.findall(r'\|\s*(RSK-[^|\s]+)\s*\|', risks)
          invalid = [risk_id for risk_id in risk_ids if not re.fullmatch(r'RSK-[0-9]{3}', risk_id)]
          if invalid:
              print('Invalid risk IDs:', ', '.join(invalid))
              sys.exit(1)

          if re.search(r'\|\s*R-[0-9]{3}\s*\|', risks):
              print('Requirement-style IDs are prohibited in the risk ID column.')
              sys.exit(1)

          print('Governance baseline controls validated.')

      - name: Validate action-family machine contract
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          text = Path('docs/traceability/action-family-registry.yaml').read_text()

          required_fragments = [
              'authoritative_for:',
              'subordinate_to:',
              'policy_overlay: internal_mutation',
              'policy_overlay: send_with_approval',
              'name: Finalize quote',
              'name: Send quote',
              'id: WF-QUOTE-001',
              'binding: exact_action_fingerprint',
              'retry_policy: no_blind_retry',
              'generated_action_map:',
              'authoritative: false',
          ]
          missing = [item for item in required_fragments if item not in text]
          if missing:
              print('Missing action-family controls:', *missing, sep='\n- ')
              sys.exit(1)

          forbidden = ['usually_true', 'usually_no', 'external_side_effects: possible']
          present = [item for item in forbidden if item in text]
          if present:
              print('Vague machine-policy values are prohibited:', *present, sep='\n- ')
              sys.exit(1)

          action_ids = re.findall(r'^  - id: (AM-[^\s]+)$', text, re.MULTILINE)
          invalid_actions = [item for item in action_ids if not re.fullmatch(r'AM-[0-9]{3}', item)]
          if invalid_actions:
              print('Invalid action-family IDs:', ', '.join(invalid_actions))
              sys.exit(1)
          if len(action_ids) != len(set(action_ids)):
              print('Duplicate action-family IDs are prohibited.')
              sys.exit(1)

          workflow_ids = re.findall(r'^  - id: (WF-[^\s]+)$', text, re.MULTILINE)
          invalid_workflows = [item for item in workflow_ids if not re.fullmatch(r'WF-[A-Z0-9-]+', item)]
          if invalid_workflows:
              print('Invalid workflow IDs:', ', '.join(invalid_workflows))
              sys.exit(1)

          if 'name: Finalize quote\n' in text:
              finalize_block = text.split('name: Finalize quote\n', 1)[1].split('\n  - id: AM-013', 1)[0]
              if 'mode: true' in finalize_block or 'policy_overlay: send_with_approval' in finalize_block:
                  print('Finalize quote must remain an internal mutation without external side effects.')
                  sys.exit(1)

          send_block = text.split('name: Send quote\n', 1)[1].split('\nworkflows:', 1)[0]
          send_requirements = [
              'policy_overlay: send_with_approval',
              'mode: always',
              'binding: exact_action_fingerprint',
              'required: true',
              'retry_policy: no_blind_retry',
          ]
          missing = [item for item in send_requirements if item not in send_block]
          if missing:
              print('Send quote is missing required safety controls:', *missing, sep='\n- ')
              sys.exit(1)

          print('Action-family machine contract validated.')

      - name: Reject placeholder citations
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\[[0-9]+\]' docs/governance docs/requirements docs/traceability; then
            echo 'Numeric placeholder citations are not permitted in controlled governance artifacts.'
            exit 1
          fi
