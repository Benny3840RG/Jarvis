name: AM-003 development commissioning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/am003-development-commissioning.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: jarvis-development-commissioning
  cancel-in-progress: false

jobs:
  commission-am003-development:
    name: Sync and smoke AM-003 on authorised development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ConvexOutgoingRamDev
    env:
      CONVEX_DEPLOYMENT: dev:outgoing-ram-798
      CONVEX_URL: https://outgoing-ram-798.convex.cloud
      PERSISTENCE_PROVIDER: convex
      JARVIS_TIMEZONE: Australia/Melbourne
      JARVIS_SOURCE_VERSION: ${{ github.sha }}
      JARVIS_DEPLOYMENT_VERSION: dev:outgoing-ram-798
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      JARVIS_SERVICE_TOKEN: ${{ secrets.JARVIS_SERVICE_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        working-directory: typescript
        shell: bash

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v7

      - name: Guard development-only boundary
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::AM-003 commissioning may run only from main."
            exit 1
          fi
          if [[ "$CONVEX_DEPLOYMENT" != "dev:outgoing-ram-798" ]]; then
            echo "::error::Unexpected Convex deployment identity."
            exit 1
          fi
          if [[ "$CONVEX_URL" != "https://outgoing-ram-798.convex.cloud" ]]; then
            echo "::error::Unexpected Convex deployment URL."
            exit 1
          fi
          for variable in CONVEX_DEPLOY_KEY JARVIS_SERVICE_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required development secret $variable is unavailable."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact main source
        run: |
          env \
            -u CONVEX_DEPLOYMENT \
            -u CONVEX_URL \
            -u PERSISTENCE_PROVIDER \
            -u JARVIS_SOURCE_VERSION \
            -u JARVIS_DEPLOYMENT_VERSION \
            -u CONVEX_DEPLOY_KEY \
            -u JARVIS_SERVICE_TOKEN \
            npm run check

      - name: Sync functions to authorised development deployment
        run: npx convex dev --once --tail-logs disable

      - name: Run self-cleaning Convex and Notes smoke
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/am003-development-smoke.log"
          npm run smoke:convex 2>&1 | tee "$smoke_log"
          grep -F "Convex smoke passed for notes: create, idempotent replay, restart visibility, cleanup." "$smoke_log"
          cp "$smoke_log" "$GITHUB_WORKSPACE/am003-development-smoke.log"

      - name: Upload commissioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: am003-development-commissioning-${{ github.run_id }}
          path: am003-development-smoke.log
          if-no-files-found: error
          retention-days: 90

      - name: Publish successful commissioning evidence
        if: success()
        working-directory: .
        run: |
          cat >"$RUNNER_TEMP/am003-success.md" <<EOF
          ## AM-003 live development commissioning passed

          - Source commit: \`$GITHUB_SHA\`
          - Workflow run: \`$GITHUB_RUN_ID\`
          - Deployment: \`dev:outgoing-ram-798\`
          - Convex URL: \`https://outgoing-ram-798.convex.cloud\`
          - Locked verification gate: passed
          - Convex function sync: passed
          - Notes create: passed
          - Mutation-level idempotent replay: passed
          - Fresh-client persistence visibility: passed
          - Authenticated cleanup: passed
          - Post-cleanup absence: passed
          - Production deployment: **not authorised and not performed**

          Artifact: \`am003-development-commissioning-$GITHUB_RUN_ID\`
          EOF
          gh issue comment 150 --body-file "$RUNNER_TEMP/am003-success.md"

      - name: Publish failed commissioning evidence
        if: failure()
        working-directory: .
        run: |
          cat >"$RUNNER_TEMP/am003-failure.md" <<EOF
          ## AM-003 live development commissioning failed

          - Source commit: \`$GITHUB_SHA\`
          - Workflow run: \`$GITHUB_RUN_ID\`
          - Deployment target: \`dev:outgoing-ram-798\`
          - Result: failed; AM-003 must remain planned
          - Production deployment: **not authorised and not performed**
          EOF
          gh issue comment 150 --body-file "$RUNNER_TEMP/am003-failure.md"
