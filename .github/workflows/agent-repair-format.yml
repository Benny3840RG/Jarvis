name: Agent repair formatter

on:
  push:
    branches:
      - agent/repair-convex-execution-boundaries

permissions:
  contents: write

jobs:
  format-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/repair-convex-execution-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        working-directory: typescript
        run: npm ci
      - name: Format repository
        working-directory: typescript
        run: npm run format
      - name: Commit formatted repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript
          git commit -m "chore: format build integrity follow-up"
          git push origin HEAD:agent/repair-convex-execution-boundaries
