name: Jarvis queue advance

# The single coordinator for autonomous builds.
#
# Applying `automation-approved` no longer starts jarvis-autobuild.yml. Every
# dispatch flows through this workflow, which:
#   1. verifies the CURRENT main revision is healthy from trusted check
#      producers (typescript.yml checks + individual github-code-scanning CodeQL
#      analyses) on every trigger, and
#   2. dispatches the bounded builder for at most one mission, only while no
#      other mission is occupied (running builder, held lock, or open candidate
#      pull request).
#
# It never reviews, approves, marks ready, merges, commissions, or deploys. Its
# definition is always resolved from the base branch, so a merged pull request
# cannot alter it. Selection logic is `.github/automation/select-next-mission.mjs`
# and is unit tested.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  schedule:
    # Recovery sweep for missed events. Offset from the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One advance at a time across the whole repository, on every trigger.
  group: jarvis-queue-advance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pr-close-cleanup:
    # A candidate PR closed WITHOUT merging: block its mission for operator
    # review and do not advance. Never clears a live lock blindly or retries.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      contains(github.event.pull_request.labels.*.name, 'automation-generated')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block the mission whose candidate was closed unmerged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const match = /^automation\/issue-(\d+)\/run-/.exec(process.env.HEAD_REF || "");
            if (!match) {
              core.info("Closed PR is not an automation candidate; nothing to clean up.");
              return;
            }
            const issueNumber = Number(match[1]);
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: "automation-in-progress",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["automation-blocked"],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body:
                `Candidate PR #${process.env.PR_NUMBER} was closed without merging. ` +
                `This mission is blocked pending operator review; the queue will not ` +
                `retry it automatically. Remove \`automation-blocked\` to re-queue.`,
            });

  verify-main:
    # Runs on every dispatch path. A scheduled sweep therefore cannot bypass an
    # earlier failure: if a bad revision is on main HEAD, this job fails and no
    # mission is dispatched.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'automation-approved') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'automation-generated')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: write
    outputs:
      verified-sha: ${{ steps.verify.outputs.verified_sha }}
    steps:
      - name: Require the labeler to be a repository writer
        # `issues: [labeled]` also fires for a triage-role user, who may apply
        # labels but is not authorised to start an autonomous build. The builder
        # trusts a dispatch from this coordinator (github-actions[bot]) and skips
        # its own actor check, so the writer gate for the label path lives here.
        # Fails closed: any lookup error refuses the advance.
        if: github.event_name == 'issues'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LABELER: ${{ github.event.sender.login }}
        with:
          script: |
            const username = process.env.LABELER;
            let permission;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              permission = data.permission;
            } catch (error) {
              core.setFailed(
                `Could not confirm \`${username}\` is a repository writer ` +
                  `(${error.status || error.message}); refusing to advance the queue.`,
              );
              return;
            }
            if (!["admin", "maintain", "write"].includes(permission)) {
              core.setFailed(
                `\`${username}\` applied automation-approved but is not a repository ` +
                  `writer (permission: ${permission}); refusing to advance the queue.`,
              );
            }

      - name: Check out the revision-health verifier from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the current main revision is healthy
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { pathToFileURL } = require("node:url");
            const { evaluateRevisionHealth, referencedRunIds } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/automation/revision-health.mjs`,
              ).href
            );

            // The verification target is always the current main HEAD.
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const sha = branch.data.commit.sha;

            const runPathById = new Map();
            const resolveRunPaths = async (checkRuns) => {
              for (const runId of referencedRunIds(checkRuns)) {
                if (runPathById.has(runId)) continue;
                try {
                  const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
                  runPathById.set(runId, run.data.path || "");
                } catch {
                  runPathById.set(runId, "");
                }
              }
            };

            const halt = async (summary) => {
              core.error(summary);
              if (process.env.EVENT_NAME === "pull_request" && process.env.MERGED_PR_NUMBER) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: Number(process.env.MERGED_PR_NUMBER),
                  body:
                    `Queue advance halted: ${summary} No further mission was dispatched. ` +
                    `Repair main; the next merge or scheduled sweep resumes the queue.`,
                });
              }
            };

            const isMerge = process.env.EVENT_NAME === "pull_request";
            const deadline = Date.now() + (isMerge ? 25 : 10) * 60 * 1000;
            let waitingFor = "checks have not started";

            while (Date.now() < deadline) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: sha,
                filter: "latest",
                per_page: 100,
              });
              await resolveRunPaths(checkRuns);
              const { ok, problems, pending } = evaluateRevisionHealth({ checkRuns, runPathById });

              if (problems.length > 0) {
                await halt(`main \`${sha}\` is not healthy (${problems.join(", ")}).`);
                core.setFailed(`main is not healthy: ${problems.join(", ")}`);
                return;
              }
              if (ok) {
                core.info(`main \`${sha}\` verified healthy from trusted producers.`);
                core.setOutput("verified_sha", sha);
                return;
              }
              waitingFor = pending.join(", ");
              core.info(`Waiting for main \`${sha}\` checks: ${waitingFor}`);
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            await halt(`timed out verifying main \`${sha}\` (still waiting for ${waitingFor}).`);
            core.setFailed(`Timed out verifying main health: ${waitingFor}`);

  advance:
    needs: [verify-main]
    if: needs.verify-main.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    steps:
      - name: Check out the pinned selection module from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Select and dispatch at most one mission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFIED_SHA: ${{ needs.verify-main.outputs.verified-sha }}
          EVENT_NAME: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          MERGED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { pathToFileURL } = require("node:url");
            const { selectNextMission, reconcileLocks } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/automation/select-next-mission.mjs`,
              ).href
            );

            const verifiedSha = process.env.VERIFIED_SHA;
            if (!/^[0-9a-f]{40}$/.test(verifiedSha || "")) {
              core.setFailed("verify-main did not publish a verified SHA.");
              return;
            }

            // Refuse to dispatch against a revision other than the one verified.
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            if (branch.data.commit.sha !== verifiedSha) {
              core.info(
                `main moved to ${branch.data.commit.sha} since verification of ` +
                  `${verifiedSha}; deferring to the next trigger.`,
              );
              return;
            }

            // A merged automation candidate releases its mission lock.
            if (process.env.EVENT_NAME === "pull_request" && process.env.MERGED === "true") {
              const match = /^automation\/issue-(\d+)\/run-/.exec(process.env.MERGED_HEAD_REF || "");
              if (match) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: Number(match[1]),
                    name: "automation-in-progress",
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            const approved = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "automation-approved",
              per_page: 100,
            });
            const inProgress = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "automation-in-progress",
              per_page: 100,
            });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const builderRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "jarvis-autobuild.yml",
              per_page: 30,
            });

            const ownRepo = `${owner}/${repo}`;
            const ownHeadRefs = openPulls
              .filter((pull) => pull.head.repo?.full_name === ownRepo)
              .map((pull) => pull.head.ref);
            const issues = approved.filter((issue) => !issue.pull_request);
            const lockedIssueNumbers = inProgress
              .filter((issue) => !issue.pull_request)
              .map((issue) => issue.number);
            const builderActive = builderRuns.data.workflow_runs.some((run) =>
              ["queued", "in_progress", "waiting", "pending", "requested"].includes(run.status),
            );

            // Recovery reconciliation: a missed pull_request:[closed] event leaves
            // a mission lock that no live candidate or run backs, which would
            // stall the queue forever. Reconcile only on a sweep, and only
            // release locks that are provably stale.
            const isSweep =
              process.env.EVENT_NAME === "schedule" ||
              process.env.EVENT_NAME === "workflow_dispatch";
            let effectiveLocks = lockedIssueNumbers;
            if (isSweep) {
              const { release, held, reason } = reconcileLocks({
                lockedIssueNumbers,
                openAutomationPrHeadRefs: ownHeadRefs,
                builderActive,
              });
              effectiveLocks = held;
              if (reason) core.info(`Lock reconciliation skipped: ${reason}.`);
              for (const staleIssue of release) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: staleIssue,
                    name: "automation-in-progress",
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: staleIssue,
                  labels: ["automation-blocked"],
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: staleIssue,
                  body:
                    `Recovered a stale mission lock: no open candidate pull request ` +
                    `and no active autonomous-build run. If a candidate was merged, ` +
                    `this is safe to ignore. Otherwise clear \`automation-blocked\` to re-queue.`,
                });
                core.info(`Released stale mission lock on #${staleIssue}.`);
              }
              for (const liveIssue of held) {
                core.info(`Kept live mission lock on #${liveIssue}.`);
              }
            }

            const result = selectNextMission({
              issues,
              openAutomationPrHeadRefs: ownHeadRefs,
              lockActive: effectiveLocks.length > 0 || builderActive,
            });
            if (result.blocked) {
              core.info(`Queue busy: ${result.reason}. No mission dispatched.`);
              return;
            }
            if (!result.issue) {
              core.info("Approved queue is drained or every candidate is ineligible.");
              for (const entry of result.skipped) {
                core.info(`  skipped #${entry.number}: ${entry.reasons.join("; ")}`);
              }
              return;
            }

            // Recheck the chosen issue immediately before dispatch.
            const issueNumber = Number(result.issue.number);
            const fresh = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const recheck = selectNextMission({
              issues: [fresh.data],
              openAutomationPrHeadRefs: ownHeadRefs,
              lockActive: false,
            });
            if (!recheck.issue) {
              core.info(
                `#${issueNumber} is no longer eligible: ` +
                  `${recheck.skipped[0]?.reasons.join("; ") || "unknown"}.`,
              );
              return;
            }

            // Carry the verified revision to the builder so its checkout and its
            // own health re-check are bound to this exact SHA, not a moving main.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "jarvis-autobuild.yml",
              ref: "main",
              inputs: { issue_number: String(issueNumber), source_sha: verifiedSha },
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body:
                `Queue advance dispatched the bounded autonomous builder for this ` +
                `mission against verified main \`${verifiedSha}\`. The mission holds ` +
                `the queue until its pull request is merged or closed. Independent ` +
                `review, exact-candidate CI, and authorised maintainer merge still apply.`,
            });
            core.info(`Dispatched jarvis-autobuild for issue #${issueNumber}.`);
