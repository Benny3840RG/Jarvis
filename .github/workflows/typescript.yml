name: Generate contract updates

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

jobs:
  generate-contract-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact test and OpenAPI replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          test_path = Path("typescript/tests/http.test.ts")
          test_text = test_path.read_text()
          capability_needle = '''        {
                    operationId: "getJarvisStatus",
                    summary: "Inspect Jarvis runtime and provider status",
                    mutating: false,
                    destructive: false,
                    mcpExposed: true,
                  },
                ],'''
          capability_replacement = '''        {
                    operationId: "getJarvisStatus",
                    summary: "Inspect Jarvis runtime and provider status",
                    mutating: false,
                    destructive: false,
                    mcpExposed: true,
                  },
                  {
                    operationId: "reasonWithTotality",
                    summary: "Run proposal-only Totality reasoning with validation and audit journalling",
                    mutating: true,
                    destructive: false,
                    mcpExposed: false,
                  },
                ],'''
          if capability_needle not in test_text:
              raise SystemExit("Capability expectation insertion point not found")
          test_text = test_text.replace(capability_needle, capability_replacement, 1)

          routes_needle = '''    const implementedRoutes = [
                ["/healthz", "get"],
                ["/api/v1/help", "get"],
                ["/api/v1/status", "get"],
              ] as const;'''
          routes_replacement = '''    const implementedRoutes = [
                ["/healthz", "get"],
                ["/api/v1/help", "get"],
                ["/api/v1/status", "get"],
                ["/api/v1/totality/reason", "post"],
              ] as const;'''
          if routes_needle not in test_text:
              raise SystemExit("Implemented-route insertion point not found")
          test_path.write_text(test_text.replace(routes_needle, routes_replacement, 1))

          contract_path = Path("typescript/openapi/jarvis.openapi.json")
          contract = json.loads(contract_path.read_text())
          contract["info"]["version"] = "0.3.0"
          contract["info"]["description"] = (
              "Jarvis accepts structured operator requests, routes work through its runtime and safety "
              "envelope, persists tasks and reminders through the configured JSON or Convex provider, "
              "and can run proposal-only Totality reasoning whose validation and audit evidence are "
              "committed atomically to Convex. This contract is intentionally single-user and private. "
              "The future ChatGPT App MCP server must keep Jarvis and OpenAI service credentials "
              "server-side and expose only operations marked with x-mcp-tool.exposed=true."
          )

          chatgpt = contract.setdefault("x-chatgpt-app", {})
          rest_only = chatgpt.setdefault("restOnlyOperationIds", [])
          if "reasonWithTotality" not in rest_only:
              rest_only.append("reasonWithTotality")

          schemas = contract.setdefault("components", {}).setdefault("schemas", {})
          schemas["TotalityActionPolicy"] = {
              "type": "object",
              "additionalProperties": False,
              "required": ["maximumToolAuthority", "requireApprovalBeforeExecution"],
              "properties": {
                  "maximumToolAuthority": {"type": "string", "enum": ["T0", "T1", "T2", "T3"]},
                  "requireApprovalBeforeExecution": {"type": "boolean"},
              },
          }
          schemas["TotalityReasonRequest"] = {
              "type": "object",
              "additionalProperties": False,
              "required": [
                  "projectId",
                  "sessionId",
                  "taskType",
                  "domainContext",
                  "goal",
                  "constraints",
                  "inputs",
                  "outputStyle",
                  "actionPolicy",
              ],
              "properties": {
                  "projectId": {"type": ["string", "null"], "minLength": 1},
                  "sessionId": {"type": "string", "minLength": 1},
                  "taskType": {
                      "type": "string",
                      "enum": [
                          "engineering_analysis",
                          "fabrication_planning",
                          "automation_design",
                          "robotics_vehicle_logic",
                          "safety_review",
                          "documentation_manual",
                          "branding_communication",
                          "project_management",
                          "comparison_tradeoff",
                          "optimization",
                          "simulation",
                          "prediction",
                          "integration",
                          "general_analysis",
                      ],
                  },
                  "domainContext": {"type": "array", "items": {"type": "string"}},
                  "goal": {"type": "string", "minLength": 1},
                  "constraints": {"type": "array", "items": {}},
                  "inputs": {"type": "array", "items": {}},
                  "outputStyle": {
                      "type": "string",
                      "enum": [
                          "for_benny_engineering",
                          "for_benny_workshop",
                          "for_client",
                          "default",
                      ],
                  },
                  "actionPolicy": {"$ref": "#/components/schemas/TotalityActionPolicy"},
              },
          }
          schemas["TotalityValidationCheck"] = {
              "type": "object",
              "additionalProperties": False,
              "required": ["id", "status"],
              "properties": {
                  "id": {"type": "string"},
                  "status": {"type": "string", "enum": ["pass", "warning", "fail"]},
                  "message": {"type": "string"},
              },
          }
          schemas["TotalityValidationReport"] = {
              "type": "object",
              "additionalProperties": False,
              "required": ["passed", "checks", "warnings", "blockingFailures"],
              "properties": {
                  "passed": {"type": "boolean"},
                  "checks": {
                      "type": "array",
                      "items": {"$ref": "#/components/schemas/TotalityValidationCheck"},
                  },
                  "warnings": {"type": "array", "items": {"type": "string"}},
                  "blockingFailures": {"type": "array", "items": {"type": "string"}},
              },
          }
          schemas["TotalityPermissionEnvelope"] = {
              "type": "object",
              "additionalProperties": False,
              "required": [
                  "reasoningLevel",
                  "riskLevel",
                  "toolAuthority",
                  "dataAccess",
                  "actionState",
              ],
              "properties": {
                  "reasoningLevel": {"type": "string", "enum": ["R0", "R1", "R2", "R3"]},
                  "riskLevel": {
                      "type": "string",
                      "enum": ["low", "moderate", "high", "critical"],
                  },
                  "toolAuthority": {"type": "string", "enum": ["T0", "T1", "T2", "T3"]},
                  "dataAccess": {"type": "string", "enum": ["D0", "D1", "D2", "D3"]},
                  "actionState": {
                      "type": "string",
                      "enum": ["read", "propose", "approve", "execute"],
                  },
              },
          }
          schemas["TotalityRoutingDecision"] = {
              "type": "object",
              "additionalProperties": False,
              "required": [
                  "primaryMode",
                  "supportingModes",
                  "permission",
                  "confidence",
                  "reasonCodes",
              ],
              "properties": {
                  "primaryMode": {"type": "string"},
                  "supportingModes": {"type": "array", "items": {"type": "string"}},
                  "permission": {"$ref": "#/components/schemas/TotalityPermissionEnvelope"},
                  "confidence": {"type": "number", "minimum": 0, "maximum": 1},
                  "reasonCodes": {"type": "array", "items": {"type": "string"}},
              },
          }
          schemas["TotalityError"] = {
              "type": "object",
              "additionalProperties": False,
              "required": ["code", "message", "retryable"],
              "properties": {
                  "code": {"type": "string"},
                  "message": {"type": "string"},
                  "retryable": {"type": "boolean"},
              },
          }
          schemas["TotalityReasonResponse"] = {
              "type": "object",
              "additionalProperties": False,
              "required": [
                  "requestId",
                  "status",
                  "routing",
                  "result",
                  "assumptions",
                  "unknowns",
                  "risks",
                  "validation",
                  "memoryUpdates",
                  "toolActions",
                  "errors",
              ],
              "properties": {
                  "requestId": {"type": "string"},
                  "status": {
                      "type": "string",
                      "enum": ["completed", "partial", "blocked", "failed"],
                  },
                  "routing": {"$ref": "#/components/schemas/TotalityRoutingDecision"},
                  "result": {
                      "oneOf": [
                          {"type": "null"},
                          {
                              "type": "object",
                              "additionalProperties": False,
                              "required": ["answer", "responseId"],
                              "properties": {
                                  "answer": {"type": "string"},
                                  "responseId": {"type": ["string", "null"]},
                              },
                          },
                      ]
                  },
                  "assumptions": {"type": "array", "items": {"type": "string"}},
                  "unknowns": {"type": "array", "items": {"type": "string"}},
                  "risks": {"type": "array", "items": {"type": "string"}},
                  "validation": {"$ref": "#/components/schemas/TotalityValidationReport"},
                  "memoryUpdates": {"type": "array", "maxItems": 0, "items": {}},
                  "toolActions": {"type": "array", "maxItems": 0, "items": {}},
                  "errors": {
                      "type": "array",
                      "items": {"$ref": "#/components/schemas/TotalityError"},
                  },
              },
          }

          if "ProblemDetails" not in schemas:
              raise SystemExit("ProblemDetails schema is required")
          responses = contract["components"].setdefault("responses", {})
          required_responses = [
              "Unauthorized",
              "TooManyRequests",
              "ServiceUnavailable",
              "InternalServerError",
          ]
          missing = [name for name in required_responses if name not in responses]
          if missing:
              raise SystemExit(f"Missing shared responses: {missing}")

          contract.setdefault("paths", {})["/api/v1/totality/reason"] = {
              "post": {
                  "operationId": "reasonWithTotality",
                  "summary": "Run proposal-only Totality reasoning with validation and audit journalling",
                  "description": (
                      "Runs deterministic routing and authority checks, requests strict structured "
                      "reasoning from OpenAI, validates the draft locally, and atomically commits the "
                      "validation report and audit event to Convex. It never applies project-memory "
                      "updates or executes tools."
                  ),
                  "tags": ["Runtime"],
                  "x-mcp-tool": {
                      "exposed": False,
                      "annotations": {
                          "readOnlyHint": False,
                          "destructiveHint": False,
                          "openWorldHint": True,
                          "idempotentHint": False,
                      },
                  },
                  "requestBody": {
                      "required": True,
                      "content": {
                          "application/json": {
                              "schema": {"$ref": "#/components/schemas/TotalityReasonRequest"}
                          }
                      },
                  },
                  "responses": {
                      "200": {
                          "description": "The reasoning draft was validated and journalled.",
                          "headers": {
                              "X-Request-Id": {"$ref": "#/components/headers/RequestId"}
                          },
                          "content": {
                              "application/json": {
                                  "schema": {"$ref": "#/components/schemas/TotalityReasonResponse"}
                              }
                          },
                      },
                      "401": {"$ref": "#/components/responses/Unauthorized"},
                      "422": {
                          "description": "The request or authority policy is invalid.",
                          "content": {
                              "application/problem+json": {
                                  "schema": {"$ref": "#/components/schemas/ProblemDetails"}
                              }
                          },
                      },
                      "429": {"$ref": "#/components/responses/TooManyRequests"},
                      "503": {"$ref": "#/components/responses/ServiceUnavailable"},
                      "500": {"$ref": "#/components/responses/InternalServerError"},
                  },
              }
          }
          contract_path.write_text(json.dumps(contract, indent=2) + "\n")
          PY
      - name: Upload generated replacements
        uses: actions/upload-artifact@v4
        with:
          name: contract-updates
          path: |
            typescript/tests/http.test.ts
            typescript/openapi/jarvis.openapi.json
          if-no-files-found: error
          retention-days: 1
      - name: Stop after generation
        run: exit 1
