# Catalog of state targets referenced by
# docs/traceability/action-family-registry.yaml#action_families[].bindings.state_target_id.
#
# `implemented` reflects whether the required durable store and state semantics
# exist in code. Lifecycle remains planned until the store is synced to the
# authorised development target and passes live persistence and isolation smoke
# evidence.
schema_version: "1.0"

state_targets:
  - id: STORE-NOTES
    lifecycle_status: active
    implemented: true
    description: Owner/project-scoped durable Convex notes with sensitivity, retention, revision, source, correlation and idempotency metadata, commissioned on dev:outgoing-ram-798.
    implementation:
      - typescript/convex/schema.ts
      - typescript/convex/notes.ts
      - typescript/src/persistence/convexNotes.ts
    bound_by: [AM-003]

  - id: STORE-TASKS
    lifecycle_status: active
    implemented: true
    description: Owner/project-scoped Convex tasks with revision metadata and atomic internal-action results for create and complete, commissioned on dev:outgoing-ram-798.
    implementation:
      - typescript/convex/schema.ts
      - typescript/convex/tasks.ts
      - typescript/src/persistence/convexControlledTasks.ts
    bound_by: [AM-004, AM-005]

  - id: STORE-REMINDERS
    lifecycle_status: active
    implemented: true
    description: Owner/project-scoped Convex reminders with preserved due text, normalized due metadata, revisions, cancellation tombstones and atomic internal-action results, commissioned on dev:outgoing-ram-798.
    implementation:
      - typescript/convex/schema.ts
      - typescript/convex/reminders.ts
      - typescript/src/persistence/convexControlledReminders.ts
    bound_by: [AM-006, AM-007]

  - id: STORE-QUOTES
    lifecycle_status: planned
    implemented: true
    note: Convex-backed QuoteRepository (src/quotes/convexQuoteRepository.ts) with aggregate, numbered revisions, controlled finalisation, and provider-neutral delivery ledger. AM-012 and AM-013 remain planned; TOOL-QUOTE-FINALIZE and TOOL-QUOTE-SEND are not in the live allowlist until a deliberate commissioning PR.
    bound_by: [AM-012, AM-013]
