name: TypeScript checks

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"

permissions:
  contents: read

jobs:
  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Produce formatter manifest
        run: ./node_modules/.bin/prettier . --list-different --ignore-path .prettierignore > formatter-diff.txt || true
      - name: Upload formatter manifest
        uses: actions/upload-artifact@v4
        with:
          name: prettier-list-different
          path: typescript/formatter-diff.txt
          retention-days: 1
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Test interactive CLI and persistence with coverage
        run: npm run test:coverage

  jarvis-console-01-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/jarvis-console-01
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/jarvis-console-01/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check the MCP app
        run: npm run build
