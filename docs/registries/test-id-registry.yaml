# Catalog of TEST-* IDs that action families in
# docs/traceability/action-family-registry.yaml may reference under
# traceability.test_ids. Each ID names committed verification code.
schema_version: "1.0"

tests:
  - id: TEST-AM-003-001
    path: typescript/tests/createNoteTool.test.ts
    verifies: successful note creation, durable receipt replay and exact execution context

  - id: TEST-AM-003-NEG-001
    path: typescript/tests/createNoteTool.test.ts
    verifies: malformed input, dry-run non-mutation, fingerprint mismatch and non-allowlisted operations

  - id: TEST-AM-003-PERSIST-001
    path: typescript/tests/convexNotes.test.ts
    verifies: authenticated Convex mutation and owner/project-scoped persistence adapter behavior
