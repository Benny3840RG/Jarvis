name: Format memory approval branch

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/scripts/add_memory_approval_contract.py"
      - ".github/workflows/format-memory-approval.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/memory-approval-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      - name: Generate memory approval contract
        run: python .github/scripts/add_memory_approval_contract.py
      - name: Format memory approval files
        working-directory: typescript
        run: >-
          npx prettier
          convex/memoryChangeSetLogic.ts
          convex/memoryChangeSets.ts
          convex/memoryChangeSetValidators.ts
          convex/projectRecords.ts
          convex/schema.ts
          convex/_generated/api.d.ts
          openapi/jarvis.openapi.json
          src/memory/memoryChangeSetFactory.ts
          src/memory/memoryChangeSets.ts
          src/persistence/convexMemoryChangeSets.ts
          src/http/app.ts
          src/http/contracts.ts
          src/http/jarvisHttpModule.ts
          src/http/memoryChangeSetController.ts
          src/http/memoryChangeSetRequest.ts
          src/http/tokens.ts
          tests/convexMemoryChangeSets.test.ts
          tests/http.test.ts
          tests/memoryChangeSetHttp.test.ts
          --write
      - name: Commit generated contract and formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript
          git commit -m "docs: align memory approval contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
