name: TypeScript checks

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

jobs:
  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Check formatting
        run: |
          set +e
          npm run format:check > prettier-errors.log 2>&1
          status=$?
          cat prettier-errors.log
          exit $status
      - name: Upload Prettier diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diagnostics
          path: typescript/prettier-errors.log
          if-no-files-found: error
          retention-days: 1
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Test interactive CLI and persistence with coverage
        run: npm run test:coverage
