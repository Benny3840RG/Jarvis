schema_version: 1
contract_id: JARVIS_DEVELOPMENT_TRANSITIONS_V1
domain: development
status: phase1-canonical

principles:
  transition_ids_are_stable_api: true
  append_only_transition_history: true
  materialized_projection_is_derivable: true
  illegal_attempts_are_audited: true
  llm_may_propose_not_commit: true
  omega_is_only_completion_committer: true

side_effect_classes:
  S0: observation_read_only
  S1: internal_reversible_state
  S2: internal_consequential_state
  S3: external_reversible_effect
  S4: external_consequential_effect
  S5: irreversible_or_high_impact_effect

failure_classes:
  REJECTED:
    meaning: request_was_not_admissible_and_no_domain_transition_committed
    retry: only_after_request_or_authority_is_corrected
  FAILED:
    meaning: operation_started_and_conclusively_failed
    retry: transition_specific
  INDETERMINATE:
    meaning: external_or_concurrent_outcome_cannot_yet_be_proven
    retry: never_blindly_retry_the_external_effect; reconcile_first

actors:
  worker_allocator:
    authority_source: authenticated_server_principal
  development_worker:
    authority_source: execution_claim_and_active_lease
  verifier:
    authority_source: authenticated_server_principal_and_mission_capability
  reviewer:
    authority_source: authenticated_server_principal_and_mission_capability
  development_controller:
    authority_source: authenticated_server_principal
  merge_executor:
    authority_source: execution_claim_and_approval_policy
  omega_completion_authority:
    authority_source: server_internal_completion_capability
    forgeable_from_event_payload: false
  operator:
    authority_source: explicit_authenticated_operator_approval

concurrency:
  expected_subject_version_required: true
  commit_rule: expected_subject_version_must_equal_current_projection_version
  conflict_result: REJECTED
  conflict_reason: STALE_SUBJECT_VERSION
  event_idempotency:
    key: event_id
    same_event_same_payload: no_op_success
    same_event_different_payload: REJECTED
  transition_idempotency:
    key: transition_request_id
    same_request_same_payload: replay_existing_evaluation
    same_request_different_payload: REJECTED

event_contract:
  current_schema_version: 1
  rejection_event_type: TRANSITION_REJECTED
  rejection_events_change_domain_state: false
  required_fields:
    - event_id
    - event_type
    - event_schema_version
    - subject_id
    - correlation_id
    - occurred_at
    - recorded_at
    - reducer_version
  transition_event_fields:
    - transition_id
    - transition_request_id
    - requested_by
    - evaluated_by
    - authorised_by
    - committed_by
    - evidence_ids
    - expected_subject_version
    - resulting_subject_version
  reducer_compatibility:
    development_projection_v1:
      readable_event_schema_versions: [1]

projection_contract:
  reducer: development_projection_v1
  current_reducer_version: 1
  writes_allowed_only_through_reducer: true
  replay_must_be_deterministic: true
  duplicate_event_application_must_be_idempotent: true

states:
  - IDEA
  - SPECIFIED
  - READY
  - CLAIMED
  - BUILDING
  - VERIFYING
  - REPAIR_REQUIRED
  - REVIEW
  - READY_TO_MERGE
  - INDETERMINATE
  - MERGED
  - CONTRADICTED
  - FAILED
  - ABORTED
  - COMPLETE

transition_defaults:
  on_gate_failure:
    outcome: REJECTED
    emit_event: TRANSITION_REJECTED
    commit_domain_state: false
  authority_check_location: authoritative_commit_path
  actor_identity_source: server_context_not_request_payload
  deterministic_evaluator: development_transition_gate_v1
  transition_retry: none

transitions:
  - id: DEV_TRANSITION_IDEA_TO_SPECIFIED
    from: IDEA
    to: SPECIFIED
    side_effect_class: S1
    reversible: true
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_issue_spec_validator
    gates:
      - issue_exists
      - objective_non_empty
      - acceptance_criteria_non_empty
      - invariant_ids_valid
    evidence_required:
      - validated_issue_spec
    constitutional_invariants: [JARVIS-011, JARVIS-012, JARVIS-014]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_SPECIFIED_TO_READY
    from: SPECIFIED
    to: READY
    side_effect_class: S1
    reversible: true
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_readiness_gate
    gates:
      - dependencies_satisfied
      - risk_class_assigned
      - capability_envelope_defined
      - required_verification_policy_defined
    evidence_required:
      - dependency_evaluation
      - authority_envelope
    constitutional_invariants: [JARVIS-011, JARVIS-012, JARVIS-014]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_READY_TO_CLAIMED
    from: READY
    to: CLAIMED
    side_effect_class: S2
    reversible: true
    requested_by: [worker_allocator]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_claim_lease_gate
    gates:
      - no_active_claim_exists
      - worker_is_eligible
      - capability_envelope_covers_issue
    evidence_required:
      - execution_claim
      - lease_record
    constitutional_invariants: [JARVIS-007, JARVIS-013, JARVIS-017]
    operation_retry:
      allowed: true
      max_attempts: 3
      backoff: bounded_exponential
      retry_only_if: [claim_write_conclusively_failed]

  - id: DEV_TRANSITION_CLAIMED_TO_BUILDING
    from: CLAIMED
    to: BUILDING
    side_effect_class: S2
    reversible: true
    requested_by: [development_worker]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_lease_authority_branch_gate
    gates:
      - execution_claim_valid
      - lease_active
      - lease_bound_to_worker
      - authority_envelope_covers_target_branch
      - expected_subject_version_matches
    evidence_required:
      - execution_claim
      - lease_record
      - branch_metadata
    constitutional_invariants: [JARVIS-007, JARVIS-013, JARVIS-016, JARVIS-017]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_BUILDING_TO_VERIFYING
    from: BUILDING
    to: VERIFYING
    side_effect_class: S2
    reversible: true
    requested_by: [development_worker]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_build_artifact_gate
    gates:
      - execution_claim_valid
      - lease_active
      - implementation_artifact_exists
      - build_receipt_recorded
    evidence_required:
      - implementation_commit
      - build_receipt
    constitutional_invariants: [JARVIS-004, JARVIS-012, JARVIS-017]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_VERIFYING_TO_REPAIR_REQUIRED
    from: VERIFYING
    to: REPAIR_REQUIRED
    side_effect_class: S1
    reversible: true
    requested_by: [verifier]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_verification_failure_gate
    gates:
      - verification_run_complete
      - verification_failed_conclusively
    evidence_required:
      - verification_receipt
      - failure_findings
    constitutional_invariants: [JARVIS-004, JARVIS-015]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_REPAIR_REQUIRED_TO_BUILDING
    from: REPAIR_REQUIRED
    to: BUILDING
    side_effect_class: S2
    reversible: true
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_repair_authority_gate
    gates:
      - repair_attempt_budget_remaining
      - valid_worker_claim_available
    evidence_required:
      - repair_work_package
      - execution_claim
    constitutional_invariants: [JARVIS-007, JARVIS-016, JARVIS-017]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_VERIFYING_TO_REVIEW
    from: VERIFYING
    to: REVIEW
    side_effect_class: S1
    reversible: true
    requested_by: [verifier]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_verification_success_gate
    gates:
      - required_verification_checks_passed
      - no_blocking_verification_findings
    evidence_required:
      - verification_receipts
    constitutional_invariants: [JARVIS-004, JARVIS-011]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_REVIEW_TO_REPAIR_REQUIRED
    from: REVIEW
    to: REPAIR_REQUIRED
    side_effect_class: S1
    reversible: true
    requested_by: [reviewer]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_review_findings_gate
    gates:
      - independent_review_complete
      - blocking_review_findings_present
    evidence_required:
      - review_receipt
      - review_findings
    constitutional_invariants: [JARVIS-004, JARVIS-015]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_REVIEW_TO_READY_TO_MERGE
    from: REVIEW
    to: READY_TO_MERGE
    side_effect_class: S2
    reversible: true
    requested_by: [reviewer]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_review_readiness_gate
    gates:
      - independent_review_passed
      - constitutional_invariants_passed
      - risk_classification_current
      - required_approval_policy_satisfied_for_readiness
    evidence_required:
      - review_receipt
      - invariant_check_receipt
      - risk_evaluation
    constitutional_invariants: [JARVIS-001, JARVIS-011, JARVIS-018]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_READY_TO_MERGE_TO_MERGED
    from: READY_TO_MERGE
    to: MERGED
    side_effect_class: S4
    reversible: false
    requested_by: [merge_executor]
    evaluated_by: [development_controller]
    authorised_by: [development_controller, operator]
    committed_by: development_controller
    evaluator: deterministic_merge_authority_gate
    gates:
      - merge_execution_claim_valid
      - branch_head_matches_approved_sha
      - risk_policy_satisfied
      - operator_approval_present_when_required
      - provider_receipt_proves_merge
    evidence_required:
      - merge_execution_claim
      - approval_record_if_required
      - provider_merge_receipt
    constitutional_invariants: [JARVIS-003, JARVIS-005, JARVIS-015, JARVIS-016]
    operation_retry:
      allowed: true
      max_attempts: 2
      backoff: bounded_exponential
      retry_only_if:
        - previous_attempt_conclusively_failed_before_external_effect
      on_ambiguous_external_result:
        transition_to: INDETERMINATE
        blindly_retry_external_effect: false

  - id: DEV_TRANSITION_READY_TO_MERGE_TO_INDETERMINATE
    from: READY_TO_MERGE
    to: INDETERMINATE
    side_effect_class: S2
    reversible: true
    requested_by: [merge_executor]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_indeterminate_outcome_gate
    gates:
      - merge_operation_was_attempted
      - outcome_not_provable_from_current_evidence
    evidence_required:
      - ambiguous_execution_receipt
    constitutional_invariants: [JARVIS-004, JARVIS-005, JARVIS-015]
    operation_retry:
      allowed: false
    reconciliation:
      required: true
      deadline_policy: bounded_reconciliation_window
      no_timeout_auto_failure: true

  - id: DEV_TRANSITION_INDETERMINATE_TO_MERGED
    from: INDETERMINATE
    to: MERGED
    side_effect_class: S2
    reversible: false
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_reconciliation_success_gate
    gates:
      - reconciliation_complete
      - external_effect_proven
    evidence_required:
      - reconciliation_receipt
      - provider_merge_evidence
    constitutional_invariants: [JARVIS-004, JARVIS-005, JARVIS-008]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_INDETERMINATE_TO_READY_TO_MERGE
    from: INDETERMINATE
    to: READY_TO_MERGE
    side_effect_class: S2
    reversible: true
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_reconciliation_non_effect_gate
    gates:
      - reconciliation_complete
      - external_effect_proven_not_to_have_occurred
      - retry_budget_remaining
      - approval_still_current
    evidence_required:
      - reconciliation_receipt
      - provider_non_merge_evidence
    constitutional_invariants: [JARVIS-005, JARVIS-015, JARVIS-016]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_INDETERMINATE_TO_CONTRADICTED
    from: INDETERMINATE
    to: CONTRADICTED
    side_effect_class: S2
    reversible: true
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_contradiction_gate
    gates:
      - reconciliation_window_exhausted_or_conflicting_authoritative_evidence_present
      - contradiction_record_created
    evidence_required:
      - contradiction_record
      - reconciliation_attempts
    constitutional_invariants: [JARVIS-004, JARVIS-005, JARVIS-008]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_INDETERMINATE_TO_FAILED
    from: INDETERMINATE
    to: FAILED
    side_effect_class: S2
    reversible: false
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_failure_gate
    gates:
      - reconciliation_complete
      - external_effect_conclusively_failed
      - no_safe_retry_path_exists
    evidence_required:
      - reconciliation_receipt
      - conclusive_failure_evidence
    constitutional_invariants: [JARVIS-005, JARVIS-015]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_MERGED_TO_COMPLETE
    from: MERGED
    to: COMPLETE
    side_effect_class: S2
    reversible: false
    requested_by: [development_controller]
    evaluated_by: [omega_completion_authority]
    authorised_by: [omega_completion_authority]
    committed_by: omega_completion_authority
    evaluator: omega_completion_policy
    gates:
      - post_merge_observation_complete
      - required_acceptance_evidence_current
      - no_unresolved_critical_contradictions
      - completion_policy_passed
      - event_schema_compatible_with_reducer
    evidence_required:
      - merge_receipt
      - post_merge_ci_receipt
      - acceptance_validation_proofs
      - contradiction_resolution_state
    constitutional_invariants: [JARVIS-001, JARVIS-004, JARVIS-008, JARVIS-018]
    operation_retry:
      allowed: false
    completion_transition: true

  - id: DEV_TRANSITION_REPAIR_REQUIRED_TO_FAILED
    from: REPAIR_REQUIRED
    to: FAILED
    side_effect_class: S2
    reversible: false
    requested_by: [development_controller]
    evaluated_by: [development_controller]
    authorised_by: [development_controller]
    committed_by: development_controller
    evaluator: deterministic_repair_exhaustion_gate
    gates:
      - repair_attempt_budget_exhausted
      - failure_is_conclusive
    evidence_required:
      - repair_attempt_history
      - conclusive_failure_evidence
    constitutional_invariants: [JARVIS-004, JARVIS-015]
    operation_retry:
      allowed: false

  - id: DEV_TRANSITION_ANY_ACTIVE_TO_ABORTED
    from:
      - SPECIFIED
      - READY
      - CLAIMED
      - BUILDING
      - VERIFYING
      - REPAIR_REQUIRED
      - REVIEW
      - READY_TO_MERGE
      - INDETERMINATE
      - CONTRADICTED
    to: ABORTED
    side_effect_class: S2
    reversible: false
    requested_by: [development_controller, operator]
    evaluated_by: [development_controller]
    authorised_by: [development_controller, operator]
    committed_by: development_controller
    evaluator: deterministic_abort_safety_gate
    gates:
      - abort_authority_present
      - no_unreconciled_external_effect_can_be_hidden_by_abort
    evidence_required:
      - abort_reason
      - reconciliation_state_if_external_effect_attempted
    constitutional_invariants: [JARVIS-005, JARVIS-012, JARVIS-017]
    operation_retry:
      allowed: false

risk_policy:
  0:
    merge_approval: controller_after_all_checks
  1:
    merge_approval: controller_after_independent_review
  2:
    merge_approval: explicit_operator_approval
  3:
    merge_approval: explicit_operator_approval
    additional_rule: constitutional_or_authority_changes_never_auto_merge
