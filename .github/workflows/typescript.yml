name: TypeScript checks

# This is the required CI gate for the main branch and all pull requests targeting main.
# The `typecheck-lint-format-test` job must pass before any PR can be merged.
# See docs/operations/ci-health.md for diagnostics and docs/operations/branch-protection.md
# for required branch protection settings.

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"
      - ".github/workflows/jarvis-autobuild.yml"
      - ".github/automation/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  automation-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Test autonomous build controls
        run: node --test .github/automation/validate-autobuild.test.mjs

  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Isolate PostHog telemetry test
        run: timeout --foreground --kill-after=10s 1m node --import tsx --test tests/posthog.test.ts
      - name: Test Node CLI and persistence with per-file coverage
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.ts jarvis-console-01/tests/*.test.ts; do
            echo "::group::${test_file}"
            timeout --foreground --kill-after=10s 30s node --import tsx --test --experimental-test-coverage "${test_file}"
            echo "::endgroup::"
          done
      - name: Test Convex suite
        run: timeout --foreground --kill-after=10s 5m npm run test:convex

  jarvis-console-01-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/jarvis-console-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/jarvis-console-01/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:ci
      - name: Build and type-check the MCP app
        run: |
          npm run build
          npm run type-check
