name: Governance validation

# Validates the action-family registry before anything is generated from it.
# Order matters: JSON Schema (structural) -> registry-reference validation ->
# semantic rule validation -> only then is `ruby scripts/generate-action-map.rb
# --check` allowed to run. See docs/validators/jarvis-action-map.rules.yaml's
# execution_order for the authoritative statement of this sequence.

on:
  pull_request:
    paths:
      - "docs/traceability/action-family-registry.yaml"
      - "docs/traceability/action-map.generated.md"
      - "docs/registries/**"
      - "docs/validators/**"
      - "docs/evidence/**"
      - "scripts/generate-action-map.rb"
      - "typescript/scripts/validate-action-map.mjs"
      - ".github/scripts/activate_task_reminder_governance.py"
      - ".github/workflows/activate-task-reminder-governance-once.yml"
      - ".github/workflows/governance-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/traceability/action-family-registry.yaml"
      - "docs/traceability/action-map.generated.md"
      - "docs/registries/**"
      - "docs/validators/**"
      - "docs/evidence/**"
      - "scripts/generate-action-map.rb"
      - "typescript/scripts/validate-action-map.mjs"
      - ".github/workflows/governance-validation.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-task-reminder-activation:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 163 &&
      github.head_ref == 'governance/activate-task-reminder-155'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact activation branch
        uses: actions/checkout@v7
        with:
          ref: governance/activate-task-reminder-155
          fetch-depth: 0

      - name: Detect pending preparer
        id: pending
        run: |
          if [[ -f .github/scripts/activate_task_reminder_governance.py ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard commissioned baseline
        if: steps.pending.outputs.run == 'true'
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "governance/activate-task-reminder-155" ]]
          git merge-base --is-ancestor 5fc8c3f477bfa9ce121b56575b0336105c37de8f HEAD

      - name: Apply evidence-bound activation records
        if: steps.pending.outputs.run == 'true'
        run: python .github/scripts/activate_task_reminder_governance.py

      - name: Regenerate action map
        if: steps.pending.outputs.run == 'true'
        run: ruby scripts/generate-action-map.rb

      - name: Set up Node.js
        if: steps.pending.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        if: steps.pending.outputs.run == 'true'
        working-directory: typescript
        run: npm ci

      - name: Validate prepared activation records
        if: steps.pending.outputs.run == 'true'
        run: |
          set -euo pipefail
          node typescript/scripts/validate-action-map.mjs
          ruby scripts/generate-action-map.rb --check

      - name: Remove branch-local one-shot assets and commit activation
        if: steps.pending.outputs.run == 'true'
        run: |
          set -euo pipefail
          git rm .github/workflows/task-reminder-development-commissioning.yml
          git rm .github/workflows/activate-task-reminder-governance-once.yml
          git rm .github/scripts/activate_task_reminder_governance.py
          git config user.name "jarvis-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/traceability/action-family-registry.yaml \
                  docs/traceability/action-map.generated.md \
                  docs/registries/policy-overlays.yaml \
                  docs/registries/tool-registry.yaml \
                  docs/registries/state-target-registry.yaml \
                  docs/registries/test-id-registry.yaml \
                  docs/registries/evidence-id-registry.yaml \
                  docs/evidence/task-reminder-actions-commissioning.md \
                  docs/superpowers/plans/2026-07-24-task-reminder-actions.md
          git commit -m "docs(governance): activate commissioned task and reminder actions"
          git push origin HEAD:governance/activate-task-reminder-155

      - name: Publish preparer result
        if: steps.pending.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 163 --body "Trusted governance preparer completed in workflow run \`$GITHUB_RUN_ID\`. Final registry validation now governs merge readiness."

  validate-action-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Validate registry schema, references, and semantic rules
        working-directory: typescript
        run: node scripts/validate-action-map.mjs

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Generate action map only after validation passes
        run: ruby scripts/generate-action-map.rb --check
