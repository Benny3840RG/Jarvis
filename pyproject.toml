[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benny-jarvis"
version = "0.1.0"
description = "Legacy Python notes prototype retained for migration and reference."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Benny" }]
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
