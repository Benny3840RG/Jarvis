version: 1
status: canonical
updated_at: 2026-10-06

vision:
  name: Governed Cognitive Operating System
  objective: >-
    Build Jarvis as a persistent, evidence-driven, self-monitoring, governable
    intelligence system that can observe, reason, plan, act, verify, reconcile,
    learn and recover while remaining subordinate to explicit authority.

invariants:
  constitution: JARVIS_CONSTITUTION.md
  transitions: TRANSITIONS.yaml
  events: EVENTS.yaml

release_tracks:
  - id: local-v1
    name: Jarvis Local V1
    status: active
    tracker_issue: 697
    plan: docs/operations/local-v1-release-plan.md
    objective: >-
      Ship a stable local daily-driver across The Beez Treez business, home and
      workshop by commissioning and composing existing capabilities before
      expanding remote production or physical actuation.
    boundary: >-
      This operational release track is orthogonal to the governed-development
      autonomy phases below. A later autonomy phase does not block Local V1
      unless a Local V1 work item explicitly depends on it.
    principles:
      - REUSE before EXTEND
      - EXTEND before HARDEN
      - HARDEN before NEW
      - commissioning evidence is required for external effects
      - unavailable physical hardware fails closed
      - no duplicate authority, execution, evidence, completion or persistence path
    workstreams:
      - id: lv1-baseline
        priority: 100
        status: ready
        objective: Lock one known-good local runtime and exact source revision.
      - id: lv1-voice-commissioning
        priority: 98
        status: commissioning_required
        depends_on:
          - lv1-baseline
        issues:
          - 567
        objective: >-
          Commission the merged guarded voice interface through typed fallback,
          microphone/wake handling where available, confirmation safety, HUD
          feedback and measured dispatch round trips.
        non_goal: Physical equipment actuation.
      - id: lv1-outlook-commissioning
        priority: 97
        status: commissioning_required
        depends_on:
          - lv1-baseline
        issues:
          - 294
          - 297
        objective: >-
          Use one non-customer development quote send/reconcile exercise to
          prove immutable provider identity, one terminal outcome and duplicate
          send prevention.
      - id: lv1-voice-query-bridge
        priority: 94
        status: planned
        depends_on:
          - lv1-voice-commissioning
        objective: >-
          Route deterministic voice query intents to existing authoritative
          Jarvis read models for business, home and workshop information.
      - id: lv1-voice-safe-writes
        priority: 92
        status: planned
        depends_on:
          - lv1-voice-query-bridge
        objective: >-
          Route safe voice writes through existing API, MCP and ToolAction
          paths without creating a voice-specific authority or execution path.
      - id: lv1-business-golden-flow
        priority: 90
        status: planned
        depends_on:
          - lv1-outlook-commissioning
        objective: >-
          Prove enquiry through client/property/project, quote finalisation and
          delivery/reconciliation to invoice draft and daily operational views.
      - id: lv1-home-daily-driver
        priority: 86
        status: planned
        depends_on:
          - lv1-baseline
        objective: >-
          Prove tasks, reminders, errands, restart persistence and the existing
          governed Google Home announcement path against pinned local devices.
      - id: lv1-workshop-daily-driver
        priority: 84
        status: planned
        depends_on:
          - lv1-baseline
        objective: >-
          Prove assets, builds, build logs, upgrades and maintenance records
          through the normal Jarvis interaction surfaces.
        non_goal: Physical machine actuation.
      - id: lv1-recovery
        priority: 99
        status: planned
        depends_on:
          - lv1-baseline
        objective: >-
          Demonstrate recoverability of the authoritative dataset actually
          relied upon by Local V1 using isolated restore and normal-store/API
          readback evidence.
      - id: lv1-dogfood
        priority: 82
        status: planned
        depends_on:
          - lv1-voice-safe-writes
          - lv1-business-golden-flow
          - lv1-home-daily-driver
          - lv1-workshop-daily-driver
          - lv1-recovery
        objective: >-
          Operate Jarvis as the daily assistant and repair only observed
          release-blocking usability, correctness or reliability defects.
      - id: lv1-release
        priority: 80
        status: planned
        depends_on:
          - lv1-dogfood
        objective: >-
          Freeze one exact candidate, run maintained verification and
          independent review, record evidence and publish the Local V1 runbook.
    existing_issue_classification:
      direct_local_v1:
        - issue: 567
          role: voice commissioning
        - issue: 294
          role: grouped Outlook quote-send commissioning
        - issue: 297
          role: grouped Outlook reconciliation commissioning
      deferred_non_blocking:
        - issue: 561
          role: TypeScript 7 compatibility after supported tooling exists
        - issue: 306
          role: remote OIDC/TLS/public gateway commissioning after Local V1
        - issue: 307
          role: production operations/deployment gate after Local V1
        - issue: 324
          role: live durable orchestration commissioning after runtime prerequisites
    post_v1:
      - physical workshop actuation through separately commissioned adapters
      - remote/public exposure
      - production deployment
      - live durable orchestration
    exit_criteria:
      - one exact release candidate passes maintained checks and OpenAPI lint
      - HUD and MCP are usable against the selected local development runtime
      - guarded voice is commissioned and returns authoritative useful reads
      - safe voice writes reuse existing governed paths
      - Outlook quote send and reconciliation have non-customer live evidence
      - one Beez Treez golden workflow completes through supported interfaces
      - home and workshop daily-driver flows are proven
      - Local V1 authoritative data has isolated restore/readback evidence
      - restart preserves correct state
      - unavailable hardware never reports successful actuation
      - independent review has no unresolved release blocker
      - exact release SHA and operator runbook are recorded

phases:
  - id: phase-1-governed-development
    name: Governed autonomous development proving slice
    status: active
    autonomy_level: 0
    objective: >-
      Convert one machine-readable GitHub issue into a tested, independently
      reviewed pull request under explicit transition, evidence and ΩΣ rules.
    domains:
      - development
    note: >-
      Two implementations of this objective coexist: the TypeScript transition
      kernel plus Convex commit boundary (workstreams below) and the GitHub
      Actions autobuild pipeline (p1-autobuild-pipeline), which runs real
      missions today. Neither has yet run end to end against a live Convex
      deployment through ΩΣ COMPLETE; that, plus p1-stress-suite and #462
      socket-isolation stability and security evidence, is the phase exit gate. Working detail:
      docs/superpowers/plans/2026-09-01-governed-development-state-machine-phase1-ledger.md.
    success_criteria:
      - illegal transitions fail closed
      - workers cannot expand authority
      - expired leases cannot authorise transitions
      - verification failure routes to repair rather than readiness
      - review failure routes to repair rather than merge readiness
      - ambiguous merge outcomes remain indeterminate until reconciled
      - merge success does not imply mission completion
      - only Omega commits COMPLETE
      - material transitions have durable causal events
      - projections are derivable from authoritative history
    workstreams:
      - id: p1-canonical-contract
        priority: 100
        status: in_progress
        outputs:
          - JARVIS_ARCHITECTURE.md
          - JARVIS_CONSTITUTION.md
          - TRANSITIONS.yaml
          - EVENTS.yaml
          - JARVIS_ROADMAP.yaml
      - id: p1-transition-kernel
        priority: 95
        status: in_progress
        depends_on:
          - p1-canonical-contract
        outputs:
          - typescript/src/development/stateMachine.ts
          - typescript/src/development/transitionRegistry.ts
          - typescript/tests/developmentStateMachine.test.ts
      - id: p1-event-contract
        priority: 90
        status: in_progress
        depends_on:
          - p1-transition-kernel
        outputs:
          - development event validation/types
          - deterministic reducer boundary
          - typescript/src/development/events.ts
          - typescript/src/development/reducer.ts
      - id: p1-github-adapter
        priority: 85
        status: in_progress
        depends_on:
          - p1-transition-kernel
        outputs:
          - governed issue validation
          - branch/PR capability adapter
          - merge attempt receipts
          - reconciliation hooks
          - typescript/src/development/githubDevelopment.ts
          - typescript/src/development/specValidation.ts
      - id: p1-omega-development-completion
        priority: 80
        status: in_progress
        depends_on:
          - p1-event-contract
          - p1-github-adapter
        outputs:
          - development completion context adapter
          - Omega-only completion commit path
          - typescript/src/development/convexDevelopmentOmegaGateway.ts
          - typescript/src/development/developmentCompletion.ts
      - id: p1-autobuild-pipeline
        priority: 78
        status: in_progress
        depends_on:
          - p1-canonical-contract
        note: >-
          Operational proving vehicle, parallel to the TypeScript kernel above.
          Serial by design (one mission from approval through merge);
          verify/select/dispatch only; writer-applied automation-approved label,
          draft PR, independent review and authorised human merge always
          required. Not phase-2, which requires bounded parallelism.
        outputs:
          - .github/workflows/jarvis-autobuild.yml
          - .github/workflows/jarvis-queue-advance.yml
          - .github/automation/select-next-mission.mjs
          - .github/automation/revision-health.mjs
          - .github/automation/validate-autobuild.mjs
          - docs/operations/autonomous-builds.md
      - id: p1-stress-suite
        priority: 75
        status: blocked
        depends_on:
          - p1-omega-development-completion
        scenarios:
          - expired lease
          - invalid authority envelope
          - worker crash
          - test failure
          - review rejection
          - repair exhaustion
          - GitHub timeout
          - merge conflict
          - post-merge CI failure
          - ambiguous provider result
          - constitutional violation

  - id: phase-2-development-queue
    name: Governed queue of development missions
    status: planned
    autonomy_level: 1
    depends_on:
      - phase-1-governed-development
    objective: Process several READY development missions with bounded parallelism and independent review.

  - id: phase-3-repair-rereview
    name: Automated repair and re-review
    status: planned
    autonomy_level: 2
    depends_on:
      - phase-2-development-queue

  - id: phase-4-low-risk-automerge
    name: Evidence-gated low-risk autonomous merge
    status: planned
    autonomy_level: 3
    depends_on:
      - phase-3-repair-rereview
    constraint: Risk 2 and Risk 3 remain operator-gated.

  - id: phase-5-continuous-backlog
    name: Continuous governed backlog consumption
    status: planned
    autonomy_level: 4
    depends_on:
      - phase-4-low-risk-automerge

  - id: phase-6-self-proposed-development
    name: Jarvis-proposed development missions
    status: planned
    autonomy_level: 5
    depends_on:
      - phase-5-continuous-backlog
    constraint: Proposals do not self-authorise implementation or constitutional change.

  - id: phase-7-governed-self-improvement
    name: Evidence-driven operational self-improvement
    status: planned
    autonomy_level: 6
    depends_on:
      - phase-6-self-proposed-development
    objective: Detect recurrent operational weaknesses and propose validated system improvements under normal governance.

expansion_domains:
  - world_model
  - operational_missions
  - opportunity_engine
  - metacognition
  - governed_learning
  - capability_topology
  - physical_world_interfaces

risk_classes:
  0:
    label: autonomous
    examples:
      - documentation
      - additional tests
      - telemetry
      - proven non-behavioural refactor
  1:
    label: guarded_autonomous
    examples:
      - isolated UI
      - read models
      - internal utilities
  2:
    label: approval_required
    examples:
      - execution semantics
      - schema changes
      - mission engine
      - permissions
      - memory
      - reconciliation
  3:
    label: operator_required
    examples:
      - Omega authority
      - constitutional policy
      - production credentials
      - irreversible migrations
      - autonomous authority expansion
