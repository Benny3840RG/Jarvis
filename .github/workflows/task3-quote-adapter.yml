name: Task 3 quote adapter verifier

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/src/persistence/convexQuotes.ts"
      - "typescript/tests/convexQuotesAdapter.test.ts"
      - "typescript/tests/quoteRestartPersistence.test.ts"
      - ".github/workflows/task3-quote-adapter.yml"

permissions:
  contents: read

jobs:
  capture-audit-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Capture npm audit JSON
        run: npm audit --audit-level=moderate --json > npm-audit.json || true
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: task3-npm-audit-report
          path: typescript/npm-audit.json
          if-no-files-found: error
