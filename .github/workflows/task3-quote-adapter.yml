name: Task 3 quote adapter verifier

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/src/persistence/convexQuotes.ts"
      - "typescript/tests/convexQuotesAdapter.test.ts"
      - "typescript/tests/quoteRestartPersistence.test.ts"
      - ".github/workflows/task3-quote-adapter.yml"

permissions:
  contents: read

jobs:
  format-task3-files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Format Task 3 files with pinned Prettier
        run: >-
          npx prettier --write
          src/persistence/convexQuotes.ts
          tests/convexQuotesAdapter.test.ts
          tests/quoteRestartPersistence.test.ts
      - name: Upload formatted Task 3 files
        uses: actions/upload-artifact@v4
        with:
          name: task3-prettier-output
          path: |
            typescript/src/persistence/convexQuotes.ts
            typescript/tests/convexQuotesAdapter.test.ts
            typescript/tests/quoteRestartPersistence.test.ts
          if-no-files-found: error
