name: Integrate current main into quote lifecycle

on:
  push:
    branches:
      - feat/quote-lifecycle-152
    paths:
      - ".github/workflows/integrate-main-quote.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/quote-lifecycle-152
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/jarvis-console-01/package-lock.json

      - name: Merge exact main and resolve known harness overlap
        env:
          EXPECTED_MAIN_SHA: d5902b3d73a08341426986810b09a7a7d3100001
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          if [ "$actual_main" != "$EXPECTED_MAIN_SHA" ]; then
            echo "main moved: expected $EXPECTED_MAIN_SHA, found $actual_main"
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN_SHA"
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "merge failed without resolvable file conflicts"
            exit 1
          fi

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              typescript/convex/test.setup.ts|typescript/vitest.config.mts|typescript/package.json|typescript/package-lock.json)
                git checkout --theirs -- "$path"
                git add "$path"
                ;;
              *)
                echo "unexpected conflict: $path"
                exit 1
                ;;
            esac
          done <<< "$conflicts"

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git rm .github/workflows/integrate-main-quote.yml
          git add -A
          git diff --cached --check

      - name: Install locked root dependencies
        working-directory: typescript
        run: npm ci

      - name: Type-check
        working-directory: typescript
        run: npm run type-check

      - name: Lint
        working-directory: typescript
        run: npm run lint

      - name: Check formatting
        working-directory: typescript
        run: npm run format:check

      - name: Validate OpenAPI
        working-directory: typescript
        run: npm run openapi:lint

      - name: Run repository and persisted Convex tests
        working-directory: typescript
        run: npm run test:coverage

      - name: Install locked Console dependencies
        working-directory: typescript/jarvis-console-01
        run: npm ci

      - name: Build and type-check Console
        working-directory: typescript/jarvis-console-01
        run: |
          npm run build
          npm run type-check

      - name: Commit verified merge and push normally
        run: |
          set -euo pipefail
          git commit -m "merge: update quote lifecycle from main"
          git push origin HEAD:feat/quote-lifecycle-152
