name: Format preview files

on:
  push:
    branches:
      - feat/chatgpt-preview
    paths:
      - .github/workflows/preview-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-preview
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      - working-directory: typescript
        run: npm run format
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript
          git commit -m "style: format ChatGPT preview adapter"
          git push origin HEAD:feat/chatgpt-preview
