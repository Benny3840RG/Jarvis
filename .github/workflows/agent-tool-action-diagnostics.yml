name: Agent tool action diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/agent-tool-action-diagnostics.yml"

permissions:
  contents: read

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Capture type-check output
        shell: bash
        run: |
          set +e
          npm run type-check > "$RUNNER_TEMP/typecheck.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/typecheck.status"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tool-action-typecheck
          path: |
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/typecheck.status
          retention-days: 1
      - name: Fail when type-check failed
        shell: bash
        run: |
          status="$(cat "$RUNNER_TEMP/typecheck.status")"
          if [[ "$status" != "0" ]]; then
            cat "$RUNNER_TEMP/typecheck.log"
            exit "$status"
          fi
