name: Format quote lifecycle task 1

on:
  push:
    branches:
      - feat/quote-lifecycle-152
    paths:
      - .github/workflows/format-quote-task-1.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/quote-lifecycle-152
          fetch-depth: 0

      - name: Guard exact branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/quote-lifecycle-152"

      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        working-directory: typescript
        run: npm ci

      - name: Format task files
        working-directory: typescript
        run: |
          npm exec prettier -- --write \
            src/quotes/quoteLifecycle.ts \
            src/quotes/quoteFingerprints.ts \
            src/quotes/quoteRepository.ts \
            src/quotes/quoteDeliveryRepository.ts \
            tests/quoteLifecycleDomain.test.ts \
            tests/quoteFingerprints.test.ts \
            ../docs/superpowers/specs/2026-07-24-quote-lifecycle-design.md \
            ../docs/superpowers/plans/2026-07-24-quote-lifecycle.md \
            ../docs/superpowers/reviews/quote-lifecycle-task-1-brief.md \
            ../docs/superpowers/reviews/quote-lifecycle-task-1-red.md \
            ../.superpowers/sdd/progress.md \
            ../.superpowers/sdd/task-1-report.md

      - name: Remove one-shot workflow and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/format-quote-task-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(quotes): format task 1 files"
          git push origin HEAD:feat/quote-lifecycle-152
          gh pr comment 174 --body "Task 1 formatter completed in run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; helper removed itself."
