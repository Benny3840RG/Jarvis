name: Agent finalize tool action hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/agent-finalize-tool-action-hardening.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Align OpenAPI security descriptions
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "openapi/jarvis.openapi.json";
          const document = JSON.parse(fs.readFileSync(path, "utf8"));
          const schemas = document.components.schemas;
          const argumentDescription =
            "Bounded JSON arguments. Credential-bearing keys, secrets, non-finite numbers, excessive nesting, and oversized strings are rejected before persistence.";
          schemas.ToolAction.properties.arguments.description = argumentDescription;
          schemas.StageToolActionRequest.properties.arguments.description = argumentDescription;
          schemas.ToolAction.properties.idempotencyKey.description =
            "Owner-scoped replay key that cannot be rebound to another action ID.";
          schemas.StageToolActionRequest.properties.idempotencyKey.description =
            "Owner-scoped replay key that cannot be rebound to another action ID.";
          fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
      - name: Apply repository formatting
        run: npx prettier --write .
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Commit verified generated changes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex docs openapi src tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "style: finalize tool action hardening"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
