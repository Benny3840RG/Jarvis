name: Refresh TypeScript lockfile

on:
  push:
    branches: [feat/convex-persistence]
    paths:
      - ".github/workflows/update-typescript-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/convex-persistence
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate lockfile from package.json
        working-directory: typescript
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Convex is locked
        run: grep -q 'node_modules/convex' typescript/package-lock.json
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build(typescript): refresh Convex lockfile"
            git push origin HEAD:feat/convex-persistence
          fi
