name: Prepare task and reminder governance activation

# Synchronisation marker 2 for the trusted default-branch preparer on PR #163.
on:
  push:
    branches:
      - governance/activate-task-reminder-155
    paths:
      - ".github/workflows/activate-task-reminder-governance-once.yml"

permissions:
  contents: write

concurrency:
  group: jarvis-task-reminder-governance-activation
  cancel-in-progress: false

jobs:
  prepare-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out activation branch
        uses: actions/checkout@v7
        with:
          ref: governance/activate-task-reminder-155
          fetch-depth: 0

      - name: Guard commissioned baseline
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/governance/activate-task-reminder-155" ]]
          git merge-base --is-ancestor 5fc8c3f477bfa9ce121b56575b0336105c37de8f HEAD

      - name: Apply evidence-bound activation records
        run: python .github/scripts/activate_task_reminder_governance.py

      - name: Regenerate action map
        run: ruby scripts/generate-action-map.rb

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        working-directory: typescript
        run: npm ci

      - name: Validate activation records
        run: |
          set -euo pipefail
          node typescript/scripts/validate-action-map.mjs
          ruby scripts/generate-action-map.rb --check

      - name: Remove one-shot assets and commit activation
        run: |
          set -euo pipefail
          git rm .github/workflows/task-reminder-development-commissioning.yml
          git rm .github/workflows/activate-task-reminder-governance-once.yml
          git rm .github/scripts/activate_task_reminder_governance.py
          git config user.name "jarvis-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/traceability/action-family-registry.yaml \
                  docs/traceability/action-map.generated.md \
                  docs/registries/policy-overlays.yaml \
                  docs/registries/tool-registry.yaml \
                  docs/registries/state-target-registry.yaml \
                  docs/registries/test-id-registry.yaml \
                  docs/registries/evidence-id-registry.yaml \
                  docs/evidence/task-reminder-actions-commissioning.md \
                  docs/superpowers/plans/2026-07-24-task-reminder-actions.md
          git commit -m "docs(governance): activate commissioned task and reminder actions"
          git push origin HEAD:governance/activate-task-reminder-155
