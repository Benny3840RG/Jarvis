name: Atomic backup diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/atomic-backup-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - name: Capture type-check
        run: |
          set +e
          npm run type-check > ../typecheck.log 2>&1
          echo $? > ../typecheck.status
          exit 0
        working-directory: typescript
      - name: Generate formatting preview
        run: npm run format
        working-directory: typescript
      - run: tar -cf atomic-backup-format.tar typescript/convex/assistantState.ts typescript/src/backup/backup.ts typescript/src/persistence/atomicConvex.ts typescript/src/persistence/atomicJson.ts typescript/tests/backup.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-backup-diagnostic
          path: |
            typecheck.log
            typecheck.status
            atomic-backup-format.tar
          if-no-files-found: error
