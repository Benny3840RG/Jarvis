name: Claude

# Responds to "@claude" mentions in issue/PR comments and reviews with the official
# anthropics/claude-code-action. Comment/review only: this job intentionally omits
# contents:write, so Claude can answer and leave review feedback but cannot push
# commits. Code changes remain the sole responsibility of the guarded autonomous
# build pipeline in jarvis-autobuild.yml. See SECURITY.md for the SHA-pinning and
# minimal-permission conventions this workflow follows.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on the PR it is responding to

    steps:
      - name: Require the Claude Code OAuth secret
        env:
          JARVIS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${JARVIS_CLAUDE_TOKEN:-}" ]]; then
            echo "::error::Required repository secret CLAUDE_CODE_OAUTH_TOKEN is unavailable."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1.0.219
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
