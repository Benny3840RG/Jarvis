name: Guardrails format diagnostic

on:
  push:
    branches:
      - agent/jarvis-guardrails-policy

permissions:
  contents: read

jobs:
  emit-prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Emit canonical formatter diff
        working-directory: typescript
        shell: bash
        run: |
          npx prettier scripts/validate-action-map.mjs tests/actionMapGuardrails.test.ts --write
          encoded="$(git diff -- scripts/validate-action-map.mjs tests/actionMapGuardrails.test.ts | base64 -w0)"
          if [ -n "$encoded" ]; then
            echo "::error title=PRETTIER_DIFF::$encoded"
            exit 1
          fi
          echo "No Prettier diff remains."
