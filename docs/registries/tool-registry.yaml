# Catalog of tool executor bindings referenced by
# docs/traceability/action-family-registry.yaml#action_families[].bindings.executor_id.
#
# `implemented` reflects the reviewed allowlist in
# typescript/src/actions/toolExecutionFactory.ts. An entry existing here does
# not make it live by itself: its implementation and lifecycle claims must
# match the runtime allowlist, state target, tests and evidence.
schema_version: "1.0"

tools:
  - id: TOOL-NOTES-CREATE
    lifecycle_status: active
    implemented: true
    description: Creates an owner/project-scoped durable note through the single allowlisted notes:create operation.
    implementation: typescript/src/actions/createNoteTool.ts
    allowlist: typescript/src/actions/toolExecutionFactory.ts
    bound_by: [AM-003]

  - id: TOOL-QUOTE-FINALIZE
    lifecycle_status: planned
    implemented: false
    description: Would transition a quote from draft/reviewed to finalized. The real Quote domain (src/quotes/quote.ts) has no finalize/reviewed states today.
    bound_by: [AM-012]

  - id: TOOL-QUOTE-SEND
    lifecycle_status: planned
    implemented: false
    description: Would send a finalized quote to a recipient and reconcile provider status. No send/delivery tool exists in the codebase today.
    bound_by: [AM-013]
