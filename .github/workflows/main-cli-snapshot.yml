name: Main CLI snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/main-cli-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: tar -cf main-cli.tar typescript/src/cli.ts
      - uses: actions/upload-artifact@v4
        with:
          name: main-cli
          path: main-cli.tar
          if-no-files-found: error
