name: Apply memory review fixes

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply_memory_review_fixes.py"
      - ".github/workflows/apply-memory-review.yml"
      - "typescript/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/memory-approval-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      - name: Apply review fixes
        run: python .github/scripts/apply_memory_review_fixes.py
      - name: Format reviewed files
        working-directory: typescript
        run: >-
          npx prettier
          convex/memoryChangeSetLogic.ts
          convex/memoryChangeSets.ts
          src/http/memoryChangeSetController.ts
          docs/operators/memory-approval.md
          tests/memoryChangeSetLogic.test.ts
          --write
      - name: Commit review fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript
          git commit -m "fix: harden memory approval edge cases"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
