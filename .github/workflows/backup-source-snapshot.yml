name: Backup source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/backup-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: tar -cf backup-source.tar typescript/src/persistence/persistence.ts typescript/src/backup/backup.ts typescript/tests/backup.test.ts typescript/convex/assistantState.ts
      - uses: actions/upload-artifact@v4
        with:
          name: backup-source
          path: backup-source.tar
          if-no-files-found: error
