name: Omega evidence accumulation fix helper

on:
  push:
    branches:
      - agent/omega-pass2-runtime-integration
    paths:
      - .github/workflows/omega-evidence-fix-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Apply exact evidence accumulation repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('typescript/convex/omegaMissions.ts')
          text = path.read_text()
          old = '''            evidenceRefs:\n              args.result === "pass" || args.result === "waived"\n                ? evidenceRefs\n                : criterion.evidenceRefs,\n'''
          new = '''            evidenceRefs:\n              args.result === "pass" || args.result === "waived"\n                ? [...new Set([...criterion.evidenceRefs, ...evidenceRefs])]\n                : criterion.evidenceRefs,\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one evidence replacement target, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit repair atomically
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TARGET_BRANCH: agent/omega-pass2-runtime-integration
        with:
          script: |
            const fs = require('fs');
            const path = 'typescript/convex/omegaMissions.ts';
            const { data: blob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: fs.readFileSync(path, 'utf8'),
              encoding: 'utf-8',
            });
            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: context.sha,
              tree: [{ path, mode: '100644', type: 'blob', sha: blob.sha }],
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'fix(omega): accumulate criterion evidence across proofs',
              tree: tree.sha,
              parents: [context.sha],
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${process.env.TARGET_BRANCH}`,
              sha: commit.sha,
              force: false,
            });
            core.info(`Created evidence repair commit ${commit.sha}`);
