name: TypeScript checks

# This is the required CI gate for the main branch and all pull requests targeting main.
# The `typecheck-lint-format-test` job must pass before any PR can be merged.
# See docs/operations/ci-health.md for diagnostics and docs/operations/branch-protection.md
# for required branch protection settings.

on:
  push:
    # No paths filter on purpose. Every commit on `main` must publish the
    # required status checks (automation-policy, typecheck-lint-format-test,
    # jarvis-console-01-build): jarvis-queue-advance.yml's `verify-main` gate
    # waits for them on `main` HEAD before dispatching a mission, so a docs-only
    # or workflow-only push that skipped this workflow would stall the approved
    # queue until an unrelated code change happened to land. `pull_request`
    # already runs unconditionally.
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  automation-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Test autonomous build controls
        run: >-
          node --test .github/automation/validate-autobuild.test.mjs
          .github/automation/development-commissioning.test.mjs
          .github/automation/validate-pr-evidence.test.mjs
          .github/automation/jarvis-queue-advance.test.mjs
          .github/automation/revision-health.test.mjs
          .github/automation/queue-codex-actor-admission.test.mjs
          .github/automation/pr-repair.test.mjs
          .github/automation/pr-maintenance.test.mjs
          .github/automation/pr-maintenance-core.test.mjs
          .github/automation/pr-maintenance-controller.test.mjs
          .github/automation/pr-maintenance-integration.test.mjs
          .github/automation/pr-maintenance-workflow.test.mjs

      - name: Check out the pinned socket compatibility fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
          path: codex-action-fixture
          persist-credentials: false
      - name: Verify worker-only socket isolation on Linux
        env:
          CODEX_ACTION_BUNDLE: ${{ github.workspace }}/codex-action-fixture/dist/main.js
        run: |
          set -euo pipefail
          if [[ ! -x /usr/bin/getfacl || ! -x /usr/bin/setfacl ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y acl
          fi
          test -f "$CODEX_ACTION_BUNDLE"
          node --test .github/automation/codex-socket-compat.test.mjs
          sudo "$(command -v node)" .github/automation/test-codex-sockets.mjs "$CODEX_ACTION_BUNDLE"

  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Test Node CLI and persistence with coverage
        run: timeout --foreground --kill-after=10s 5m node --import tsx --test --experimental-test-coverage tests/*.test.ts jarvis-console-01/tests/*.test.ts
      - name: Test Convex suite
        run: timeout --foreground --kill-after=10s 5m npm run test:convex

  jarvis-console-01-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/jarvis-console-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/jarvis-console-01/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:ci
      - name: Build and type-check the MCP app
        run: |
          npm run build
          npm run type-check
