name: Activate AM-003 governance

on:
  push:
    branches:
      - docs/activate-am003-150
    paths:
      - ".github/workflows/activate-am003-governance.yml"

permissions:
  contents: write

jobs:
  activate-am003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/activate-am003-150

      - name: Activate only the proven AM-003 chain
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          action_path = Path("docs/traceability/action-family-registry.yaml")
          text = action_path.read_text(encoding="utf-8")
          am003, suffix = text.split("  - id: AM-012", 1)

          old_status = "  - id: AM-003\n    name: Create note\n    lifecycle_status: planned"
          new_status = "  - id: AM-003\n    name: Create note\n    lifecycle_status: active"
          if am003.count(old_status) != 1:
              raise SystemExit("AM-003 planned status was not found exactly once")
          am003 = am003.replace(old_status, new_status, 1)

          old_trace = "      test_ids: []\n      evidence_ids: []"
          new_trace = """      test_ids:
                - TEST-AM-003-001
                - TEST-AM-003-NEG-001
                - TEST-AM-003-PERSIST-001
                - TEST-AM-003-SMOKE-001
              evidence_ids:
                - EVD-AM-003-001""".replace("            ", "")
          if am003.count(old_trace) != 1:
              raise SystemExit("AM-003 empty traceability was not found exactly once")
          am003 = am003.replace(old_trace, new_trace, 1)
          action_path.write_text(am003 + "  - id: AM-012" + suffix, encoding="utf-8")

          tool_path = Path("docs/registries/tool-registry.yaml")
          tool = tool_path.read_text(encoding="utf-8")
          old_tool = """  - id: TOOL-NOTES-CREATE
              lifecycle_status: planned
              implemented: true
              description: Implements owner/project-scoped durable note creation through the single reviewed notes:create allowlist binding; operational activation awaits development smoke evidence.""".replace("          ", "")
          new_tool = """  - id: TOOL-NOTES-CREATE
              lifecycle_status: active
              implemented: true
              description: Owner/project-scoped durable note creation through the single reviewed notes:create allowlist binding, commissioned on dev:outgoing-ram-798.""".replace("          ", "")
          if tool.count(old_tool) != 1:
              raise SystemExit("TOOL-NOTES-CREATE planned block was not found exactly once")
          tool_path.write_text(tool.replace(old_tool, new_tool, 1), encoding="utf-8")

          state_path = Path("docs/registries/state-target-registry.yaml")
          state = state_path.read_text(encoding="utf-8")
          old_state = """  - id: STORE-NOTES
              lifecycle_status: planned
              implemented: true
              description: Implements owner/project-scoped durable Convex notes with sensitivity, retention, revision, source, correlation and idempotency metadata; activation awaits development smoke evidence.""".replace("          ", "")
          new_state = """  - id: STORE-NOTES
              lifecycle_status: active
              implemented: true
              description: Owner/project-scoped durable Convex notes with sensitivity, retention, revision, source, correlation and idempotency metadata, commissioned on dev:outgoing-ram-798.""".replace("          ", "")
          if state.count(old_state) != 1:
              raise SystemExit("STORE-NOTES planned block was not found exactly once")
          state_path.write_text(state.replace(old_state, new_state, 1), encoding="utf-8")
          PY

      - name: Regenerate non-authoritative action map
        run: ruby scripts/generate-action-map.rb

      - name: Remove one-shot activation workflow
        run: rm .github/workflows/activate-am003-governance.yml

      - name: Commit generated activation
        run: |
          set -euo pipefail
          git config user.name "jarvis-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/traceability/action-family-registry.yaml \
            docs/traceability/action-map.generated.md \
            docs/registries/tool-registry.yaml \
            docs/registries/state-target-registry.yaml \
            .github/workflows/activate-am003-governance.yml
          git commit -m "docs(governance): activate commissioned AM-003"
          git push origin HEAD:docs/activate-am003-150
