name: Apply contract updates

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

permissions:
  actions: read
  contents: write

jobs:
  apply-contract-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download generated replacements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Benny3840/Jarvis/actions/artifacts/8317276323/zip \
            --output contract-updates.zip
          rm -rf contract-updates
          mkdir contract-updates
          unzip -q contract-updates.zip -d contract-updates
      - name: Apply and commit replacements
        run: |
          cp contract-updates/tests/http.test.ts typescript/tests/http.test.ts
          cp contract-updates/openapi/jarvis.openapi.json typescript/openapi/jarvis.openapi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/tests/http.test.ts typescript/openapi/jarvis.openapi.json
          git diff --cached --check
          git commit -m "docs: align Totality HTTP contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
