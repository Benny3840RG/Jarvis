name: Format preview

on:
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npm run format
        working-directory: typescript
      - run: tar -cf format-preview.tar typescript/src/persistence/persistence.ts typescript/tests/persistence.test.ts typescript/tests/fixtures/jsonWriter.ts
      - uses: actions/upload-artifact@v4
        with:
          name: format-preview
          path: format-preview.tar
          if-no-files-found: error
      - run: git diff --exit-code
