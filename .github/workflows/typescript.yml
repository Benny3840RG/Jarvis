name: TypeScript checks

# This is the required CI gate for the main branch and all pull requests targeting main.
# The `typecheck-lint-format-test` job must pass before any PR can be merged.
# See docs/operations/ci-health.md for diagnostics and docs/operations/branch-protection.md
# for required branch protection settings.

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
      - ".github/workflows/development-commissioning.yml"
      - ".github/workflows/queue-development-commissioning.yml"

permissions:
  contents: read

jobs:
  typecheck-lint-format-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint TypeScript and Convex
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate OpenAPI contract
        run: npm run openapi:lint
      - name: Test interactive CLI and persistence with coverage
        run: npm run test:coverage

  jarvis-console-01-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/jarvis-console-01
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/jarvis-console-01/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check the MCP app
        run: npm run build

  apply-reconciliation-read-classification:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/external-reconciliation-154'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/external-reconciliation-154
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        working-directory: typescript
        run: npm ci
      - name: Apply fail-closed read classification and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          execution = Path("typescript/src/actions/toolExecution.ts")
          text = execution.read_text(encoding="utf-8")

          old_union = '  | "reconciliation-escalated";'
          new_union = '  | "reconciliation-escalated"\n  | "reconciliation-unavailable";'
          if text.count(old_union) != 1:
              raise SystemExit("tool execution error-code union anchor was not found exactly once")
          text = text.replace(old_union, new_union, 1)

          digest_anchor = '''function digest(value: unknown): string {
            return createHash("sha256").update(canonicalJson(value), "utf8").digest("hex");
          }
          '''
          helper = '''function digest(value: unknown): string {
            return createHash("sha256").update(canonicalJson(value), "utf8").digest("hex");
          }

          function isEffectFingerprintConflict(error: unknown): boolean {
            if (!(error instanceof Error)) return false;
            return (
              error.message.includes("another effect fingerprint") ||
              error.message.includes("effect fingerprint collision")
            );
          }
          '''
          if text.count(digest_anchor) != 1:
              raise SystemExit("tool execution digest anchor was not found exactly once")
          text = text.replace(digest_anchor, helper, 1)

          old_catch = '''    } catch {
              return this.persistDecision(
                key,
                receipt(
                  input.action,
                  input.idempotencyKey,
                  "blocked",
                  "fingerprint-mismatch",
                  new Date().toISOString(),
                  { ...input, effectFingerprint: scope.effectFingerprint, provider },
                ),
              );
            }
          '''
          new_catch = '''    } catch (error: unknown) {
              const errorCode = isEffectFingerprintConflict(error)
                ? "fingerprint-mismatch"
                : "reconciliation-unavailable";
              return this.persistDecision(
                key,
                receipt(
                  input.action,
                  input.idempotencyKey,
                  "blocked",
                  errorCode,
                  new Date().toISOString(),
                  { ...input, effectFingerprint: scope.effectFingerprint, provider },
                ),
              );
            }
          '''
          if text.count(old_catch) != 1:
              raise SystemExit("external replay catch block was not found exactly once")
          execution.write_text(text.replace(old_catch, new_catch, 1), encoding="utf-8")

          validators = Path("typescript/convex/toolExecutionValidators.ts")
          text = validators.read_text(encoding="utf-8")
          old_validator = '  v.literal("reconciliation-escalated"),\n);'
          new_validator = '  v.literal("reconciliation-escalated"),\n  v.literal("reconciliation-unavailable"),\n);'
          if text.count(old_validator) != 1:
              raise SystemExit("tool execution validator anchor was not found exactly once")
          validators.write_text(text.replace(old_validator, new_validator, 1), encoding="utf-8")

          convex = Path("typescript/convex/externalReconciliations.ts")
          text = convex.read_text(encoding="utf-8")
          old_convex_union = '      | "reconciliation-escalated";'
          new_convex_union = '      | "reconciliation-escalated"\n      | "reconciliation-unavailable";'
          if text.count(old_convex_union) != 1:
              raise SystemExit("Convex receipt error-code union anchor was not found exactly once")
          convex.write_text(text.replace(old_convex_union, new_convex_union, 1), encoding="utf-8")
          PY
          cd typescript
          npm run format
          cd ..
          git fetch origin main
          git checkout origin/main -- .github/workflows/typescript.yml
          git config user.name "jarvis-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation): distinguish store outages from effect collisions"
          git push origin HEAD:feat/external-reconciliation-154
