name: Generate preview lock artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - typescript/package.json
      - .github/workflows/generate-preview-lock.yml

permissions:
  contents: write

jobs:
  generate-preview-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Generate lockfile
        working-directory: typescript
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- typescript/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript/package-lock.json
          git commit -m "build: lock MCP preview dependencies"
          git push origin HEAD:${{ github.head_ref }}
