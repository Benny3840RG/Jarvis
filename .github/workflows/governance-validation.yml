name: Governance validation

# Validates the action-family registry before anything is generated from it.
# Order matters: JSON Schema (structural) -> registry-reference validation ->
# semantic rule validation -> only then is `ruby scripts/generate-action-map.rb
# --check` allowed to run. See docs/validators/jarvis-action-map.rules.yaml's
# execution_order for the authoritative statement of this sequence.

on:
  pull_request:
    paths:
      - "docs/governance/guardrails.md"
      - "docs/traceability/action-family-registry.yaml"
      - "docs/traceability/action-map.generated.md"
      - "docs/registries/**"
      - "docs/validators/**"
      - "scripts/generate-action-map.rb"
      - "typescript/scripts/validate-action-map.mjs"
      - ".github/workflows/governance-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/governance/guardrails.md"
      - "docs/traceability/action-family-registry.yaml"
      - "docs/traceability/action-map.generated.md"
      - "docs/registries/**"
      - "docs/validators/**"
      - "scripts/generate-action-map.rb"
      - "typescript/scripts/validate-action-map.mjs"
      - ".github/workflows/governance-validation.yml"

permissions:
  contents: read

jobs:
  validate-action-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Validate registry schema, references, and semantic rules
        working-directory: typescript
        run: node scripts/validate-action-map.mjs

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Generate action map only after validation passes
        run: ruby scripts/generate-action-map.rb --check
