name: Copilot Review Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  copilot-review-section:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Copilot Review section exists
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            if (!body.includes("Copilot Review")) {
              core.setFailed("PR description must include a '# Copilot Review' section (see .github/PULL_REQUEST_TEMPLATE.md).");
            }
